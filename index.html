<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>SocialLoop Permanent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff;height:100dvh;display:flex;flex-direction:column}
.in{width:100%;max-width:360px;background:#e8efff;border:none;padding:18px;border-radius:18px;color:#000;font-size:16px;outline:none;margin-top:12px}
.bt{width:100%;max-width:360px;background:#c084fc;border:none;padding:18px;border-radius:28px;font-weight:900;color:#000;margin-top:14px;cursor:pointer}
.page{display:none;max-width:600px;margin:0 auto;width:100%;padding-bottom:130px;flex-direction:column;flex:1;overflow:auto}.page.on{display:flex}
.header{padding:12px 16px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center;background:#000;position:sticky;top:0;z-index:10}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 12px;max-width:600px;margin:0 auto;width:100%;z-index:20}
.ni{color:#777;font-size:11px;text-align:center;cursor:pointer}.ni.on{color:#c084fc}
.plus{background:#c084fc;color:#000;width:38px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.dot{width:9px;height:9px;border-radius:50%;background:#333;display:inline-block}.dot.on{background:#25D366;box-shadow:0 0 6px #25D366}
.bar{display:flex;gap:8px;padding:8px 10px;background:#1a1a1a;border-top:1px solid #222;align-items:center;position:fixed;bottom:58px;left:0;right:0;max-width:600px;margin:0 auto;z-index:30}
.inner{flex:1;display:flex;gap:8px;background:#2a2a2a;border-radius:28px;padding:6px 14px;align-items:center}
.mi{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:8px;font-size:15px}
.mic{background:#25D366;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
.bubble{padding:10px 14px;border-radius:18px;max-width:78%;font-size:13px;word-break:break-word}.me{background:#c084fc;color:#000;align-self:flex-end}.other{background:#222;align-self:flex-start}
.pill{padding:6px 14px;border-radius:18px;border:none;font-size:12px}.pill.on{background:#c084fc;color:#000;font-weight:700}.pill.off{background:#222;color:#fff}
</style></head><body>

<div id="login" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">
<h1 style="font-size:44px;font-weight:900">Social<span style="color:#c084fc">Loop</span></h1>
<input id="email" class="in" placeholder="Email" value="mantorolimpho@gmail.com">
<input id="pass" class="in" type="password" placeholder="Password">
<button class="bt" id="enterBtn">Enter</button>
<p style="color:#666;font-size:11px;margin-top:8px">Permanent storage enabled ✓</p>
</div>

<div id="app" style="display:none;flex:1;flex-direction:column;overflow:hidden">
<div class="header"><b>Social<span style="color:#c084fc">Loop</span></b><span id="topE" style="font-size:11px;color:#888"></span></div>

<div id="pFeed" class="page on"><div id="feed"></div></div>
<div id="pLive" class="page"><div style="padding:12px;font-weight:700;border-bottom:1px solid #111">Live Box <span class="dot on"></span></div><div id="liveList" style="flex:1;overflow:auto"></div></div>
<div id="pReels" class="page"><div id="reelsList"></div></div>
<div id="pInbox" class="page"><div id="inboxUsers" style="flex:1;overflow:auto"></div><div id="chatBox" style="display:none;flex:1;flex-direction:column"><div style="padding:10px;border-bottom:1px solid #222;display:flex;justify-content:space-between"><b id="chatName"></b><span onclick="closeChat()" style="color:#c084fc">Back</span></div><div id="chatMsgs" style="flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px"></div></div></div>
<div id="pProfile" class="page" style="padding:20px;text-align:center"><img id="myAvatar" style="width:90px;height:90px;border-radius:50%;border:3px solid #c084fc"><div id="myName" style="margin-top:8px;font-weight:700"></div><div id="myEmail2" style="color:#888;font-size:12px"></div><button onclick="logout()" style="margin-top:12px;background:#222;color:#fff;border:none;padding:8px 16px;border-radius:20px">Logout</button><div id="myPosts" style="margin-top:20px;text-align:left"></div></div>
<div id="pCreate" class="page" style="padding:16px"><h3>Create (Permanent)</h3><div style="display:flex;gap:6px;margin:12px 0"><button class="pill on" id="bPost" onclick="setM('post')">Post</button><button class="pill off" id="bReel" onclick="setM('reel')">Reels</button><button class="pill off" id="bStatus" onclick="setM('status')">Status</button></div><input id="cCap" class="in" placeholder="Caption..." style="max-width:100%;background:#1a1a1a;color:#fff;border:1px solid #333"><input type="file" id="cFile" accept="image/*,video/*" style="margin:12px 0"><div id="cPrev"></div><p id="upProg" style="color:#c084fc;font-size:12px"></p><button class="bt" style="max-width:100%" onclick="doCreate()">Share Forever</button></div>

<!-- BAR: 😊 Message 📎 📷 🎤 -->
<div class="bar"><div class="inner"><button style="background:none;border:none;font-size:20px">😊</button><input id="mainInp" class="mi" placeholder="Message"><label for="mainFile" style="font-size:20px;cursor:pointer">📎</label><label for="mainFile" style="font-size:20px;cursor:pointer">📷</label><input type="file" id="mainFile" accept="image/*,video/*" style="display:none"></div><button class="mic" id="mainSend">🎤</button></div>

<div class="nav"><div class="ni on" id="nFeed" onclick="openTab('Feed')">🏠<br>Feed</div><div class="ni" id="nLive" onclick="openTab('Live')">🔴<br>Live</div><div onclick="openTab('Create')"><div class="plus">+</div></div><div class="ni" id="nReels" onclick="openTab('Reels')">🎬<br>Reels</div><div class="ni" id="nInbox" onclick="openTab('Inbox')">📩<br>Inbox</div><div class="ni" id="nProfile" onclick="openTab('Profile')">👤<br>Me</div></div>
</div>

<div id="profModal" style="display:none;position:fixed;inset:0;background:#000;z-index:99;padding:20px;overflow:auto"><div style="display:flex;justify-content:space-between"><b id="profU"></b><span onclick="document.getElementById('profModal').style.display='none'" style="color:#c084fc">Close X</span></div><div style="text-align:center;margin-top:20px"><img id="profA" style="width:90px;height:90px;border-radius:50%;border:3px solid #c084fc"><div id="profE" style="color:#888;margin-top:8px"></div><div id="profOnline" style="margin-top:6px"></div><button id="followBtn" style="margin-top:12px;background:#c084fc;border:none;padding:8px 16px;border-radius:20px;font-weight:700">Follow</button></div><div id="profPosts" style="margin-top:20px"></div></div>

<script>
const SUPA_URL="https://ysfjnpyhwogfjkdzruqz.supabase.co";const SUPA_KEY="sb_publishable_MMVTip9_ZpJOpyilnXPF3w_SnXHgnfL";const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let ME=null,MODE='post',CUR=null,ACTIVE='Feed';

function enterNow(){
 let e=document.getElementById('email').value.trim().toLowerCase()||'mantorolimpho@gmail.com';
 ME={id:Date.now()+'',username:e.split('@')[0].replace(/\s+/g,''),email:e,avatar:'https://i.pravatar.cc/150?u='+e,online:true,last_seen:Date.now()};
 localStorage.setItem('sl_user',JSON.stringify(ME));
 document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';
 document.getElementById('topE').innerText=e;
 sb.from('users').upsert(ME).then(()=>{loadFeed();});
}
document.getElementById('enterBtn').addEventListener('click',enterNow);
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')enterNow();});
let saved=localStorage.getItem('sl_user');if(saved){ME=JSON.parse(saved);document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('topE').innerText=ME.email;sb.from('users').upsert({...ME,online:true,last_seen:Date.now()}).then(()=>loadFeed());}

function openTab(t){ACTIVE=t;document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById('p'+t).classList.add('on');document.querySelectorAll('.ni').forEach(n=>n.classList.remove('on'));let el=document.getElementById('n'+t);if(el)el.classList.add('on');if(t==='Feed')loadFeed();if(t==='Live')loadLive();if(t==='Reels')loadReels();if(t==='Inbox')loadInbox();if(t==='Profile')loadMyProfile();}
function logout(){localStorage.clear();location.reload();}
function setM(m){MODE=m;document.getElementById('bPost').className=m==='post'?'pill on':'pill off';document.getElementById('bReel').className=m==='reel'?'pill on':'pill off';document.getElementById('bStatus').className=m==='status'?'pill on':'pill off';}
function mediaTag(url){if(!url)return'';if(url.includes('.mp4')||url.includes('video'))return `<video src="${url}" controls style="width:100%;border-radius:12px"></video>`;return `<img src="${url}" style="width:100%;border-radius:12px">`;}
// PERMANENT UPLOAD TO BUCKET
async function uploadPermanent(file){
 if(!file)return'';document.getElementById('upProg').innerText='Uploading permanent...';
 let name=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9.]/g,'');
 let {error}=await sb.storage.from('media').upload(name,file,{upsert:true});
 if(error){document.getElementById('upProg').innerText='Upload error: '+error.message;return'';}
 let {data}=sb.storage.from('media').getPublicUrl(name);
 document.getElementById('upProg').innerText='Permanent ✓';
 return data.publicUrl;
}
async function openProfile(username){
 let {data:u}=await sb.from('users').select('*').eq('username',username).single();if(!u)return;
 document.getElementById('profU').innerText='@'+u.username;document.getElementById('profE').innerText=u.email;document.getElementById('profA').src=u.avatar;
 let on=Date.now()-u.last_seen<120000;document.getElementById('profOnline').innerHTML=`<span class="dot ${on?'on':''}"></span> ${on?'<span style="color:#25D366">Online</span>':'Offline'} • ✓✓ delivered • <span style="color:#1e90ff">✓✓ read</span>`;
 let {data:posts}=await sb.from('posts').select('*').eq('username',username).order('created_at',{ascending:false});
 document.getElementById('profPosts').innerHTML=(posts||[]).map(p=>`<div style="border-bottom:1px solid #111;padding:8px">${mediaTag(p.image)}<div>${p.caption||''}</div></div>`).join('')||'<div style="color:#555">No posts</div>';
 let {data:f}=await sb.from('follows').select('*').eq('follower',ME.username).eq('following',username);
 document.getElementById('followBtn').innerText=f&&f.length>0?'Unfollow':'Follow';
 document.getElementById('followBtn').onclick=()=>toggleFollow(username);
 document.getElementById('profModal').style.display='block';
}
async function toggleFollow(username){let {data}=await sb.from('follows').select('*').eq('follower',ME.username).eq('following',username);if(data&&data.length>0){await sb.from('follows').delete().eq('follower',ME.username).eq('following',username);document.getElementById('followBtn').innerText='Follow';}else{await sb.from('follows').insert({follower:ME.username,following:username,created_at:Date.now()});document.getElementById('followBtn').innerText='Unfollow';}}

async function loadFeed(){
 let {data:posts}=await sb.from('posts').select('*').eq('type','post').order('created_at',{ascending:false}).limit(50);
 let {data:likes}=await sb.from('likes').select('*');let {data:comments}=await sb.from('comments').select('*');let {data:users}=await sb.from('users').select('*');
 document.getElementById('feed').innerHTML=(posts||[]).map(p=>{
  let u=users?.find(x=>x.username===p.username);let on=u&&Date.now()-u.last_seen<120000;
  let lc=(likes||[]).filter(l=>l.post_id==p.id).length;let liked=(likes||[]).some(l=>l.post_id==p.id&&l.username==ME.username);
  let cc=(comments||[]).filter(c=>c.post_id==p.id);
  return `<div style="border-bottom:1px solid #111"><div style="display:flex;gap:8px;padding:10px;align-items:center;cursor:pointer" onclick="openProfile('${p.username}')"><img src="${p.avatar}" style="width:32px;height:32px;border-radius:50%"><b>${p.username}</b> <span class="dot ${on?'on':''}"></span> <small style="color:#888">✓✓</small></div>${mediaTag(p.image)}<div style="padding:8px 12px">${p.caption||''}</div><div style="display:flex;gap:16px;padding:10px;border-top:1px solid #111"><span onclick="likePost(${p.id})" style="cursor:pointer">${liked?'❤️':'🤍'} Like ${lc}</span><span onclick="document.getElementById('cbox${p.id}').style.display='flex'" style="cursor:pointer">💬 Comment ${cc.length}</span><span style="margin-left:auto;color:#555;font-size:11px">Permanent</span></div><div id="cbox${p.id}" style="display:none;flex-direction:column;gap:6px;padding:10px;background:#0a0a0a"><div>${cc.map(c=>`<div style="font-size:13px">${c.image?mediaTag(c.image):''}<b>${c.username}:</b> ${c.text} ${c.username==ME.username?`<span onclick="delComment(${c.id})" style="color:#f55"> Delete</span> <span onclick="editComment(${c.id},'${c.text.replace(/'/g,'')}')" style="color:#c084fc"> Edit</span>`:''}</div>`).join('')}</div><div style="display:flex;gap:6px"><input id="cinp${p.id}" placeholder="Message" style="flex:1;background:#222;border:1px solid #333;border-radius:20px;padding:10px;color:#fff"><input type="file" id="cfile${p.id}" accept="image/*,video/*" style="display:none" onchange="setCFile(${p.id},event)"><label for="cfile${p.id}" style="background:#222;padding:10px;border-radius:20px;cursor:pointer">📷</label><button onclick="addComment(${p.id})" style="background:#c084fc;border:none;padding:10px 14px;border-radius:20px">Send</button></div></div></div>`;
 }).join('')||'<div style="padding:30px;text-align:center;color:#666">No posts yet — permanent database empty, tap + to post first photo/video that will stay forever</div>';
}
async function likePost(id){let {data}=await sb.from('likes').select('*').eq('post_id',id).eq('username',ME.username);if(data&&data.length>0)await sb.from('likes').delete().eq('post_id',id).eq('username',ME.username);else await sb.from('likes').insert({post_id:id,username:ME.username,created_at:Date.now()});loadFeed();}
async function addComment(pid){let el=document.getElementById('cinp'+pid);let t=el.value.trim();let f=el.getAttribute('data-file')||'';let fileObj=el._file;if(fileObj){f=await uploadPermanent(fileObj);}if(!t&&!f)return;el.value='';el.removeAttribute('data-file');el._file=null;await sb.from('comments').insert({post_id:pid,username:ME.username,text:t,image:f,created_at:Date.now()});loadFeed();}
function setCFile(pid,ev){let file=ev.target.files[0];if(!file)return;let el=document.getElementById('cinp'+pid);el._file=file;el.placeholder='Photo ready - tap Send';}
async function delComment(id){if(!confirm('Delete comment?'))return;await sb.from('comments').delete().eq('id',id);loadFeed();}
async function editComment(id,old){let ne=prompt('Edit:',old);if(!ne)return;await sb.from('comments').update({text:ne}).eq('id',id);loadFeed();}
async function loadLive(){let {data}=await sb.from('live_messages').select('*').order('created_at',{ascending:true}).limit(80);document.getElementById('liveList').innerHTML=(data||[]).map(m=>`<div style="border:2px solid #c084fc;border-radius:16px;margin:10px;padding:8px;position:relative"><div style="font-size:11px;cursor:pointer" onclick="openProfile('${m.username}')">${m.username} <span class="dot on"></span> • Permanent</div>${mediaTag(m.image)}<div>${m.text||''}</div><div style="font-size:10px;color:#888">✓✓ delivered • <span style="color:#1e90ff">✓✓ read</span></div>${m.username==ME.username?`<button onclick="delLive(${m.id})" style="position:absolute;top:6px;right:6px;background:#300;color:#fff;border:none;border-radius:50%;width:20px;height:20px">x</button> <button onclick="editLive(${m.id},'${(m.text||'').replace(/'/g,'')}')" style="position:absolute;top:6px;right:30px;background:#222;color:#c084fc;border:none;border-radius:6px;padding:2px 6px;font-size:10px">Edit</button>`:''}</div>`).join('');}
async function delLive(id){if(!confirm('Delete?'))return;await sb.from('live_messages').delete().eq('id',id);loadLive();}
async function editLive(id,old){let ne=prompt('Edit:',old);if(!ne)return;await sb.from('live_messages').update({text:ne}).eq('id',id);loadLive();}
async function loadReels(){let {data}=await sb.from('posts').select('*').eq('type','reel').order('created_at',{ascending:false});document.getElementById('reelsList').innerHTML=(data||[]).map(p=>`<div style="height:75vh;position:relative;border-bottom:1px solid #111">${mediaTag(p.image)}<div style="position:absolute;bottom:80px;left:10px;right:10px"><b onclick="openProfile('${p.username}')">@${p.username} <span class="dot on"></span></b><br>${p.caption||''}<br><small>❤️ Like • 💬 Comment with 📷📎 • Permanent</small></div></div>`).join('')||'<div style="padding:30px;color:#666;text-align:center">No Reels yet — permanent</div>';}
async function loadInbox(){let {data:users}=await sb.from('users').select('*');document.getElementById('inboxUsers').innerHTML=(users||[]).filter(u=>u.username!==ME.username).map(u=>{let on=Date.now()-u.last_seen<120000;return `<div style="padding:12px;border-bottom:1px solid #111;display:flex;gap:8px;align-items:center" onclick="openChat('${u.username}')"><img src="${u.avatar}" style="width:36px;height:36px;border-radius:50%"><div><b>${u.username}</b> <span class="dot ${on?'on':''}"></span><br><small style="color:${on?'#25D366':'#666'}">${on?'Online • ✓✓':'Offline • ✓'}</small></div><span style="margin-left:auto">💬</span></div>`}).join('')||'<div style="padding:20px;color:#666;text-align:center">Create 2nd account to test inbox — both permanent</div>';}
function openChat(u){CUR=u;document.getElementById('inboxUsers').style.display='none';document.getElementById('chatBox').style.display='flex';document.getElementById('chatName').innerText=u;renderChat();sb.from('secret_messages').update({read:true}).eq('from_user',u).eq('to_user',ME.username).then(()=>{});}
function closeChat(){CUR=null;document.getElementById('chatBox').style.display='none';document.getElementById('inboxUsers').style.display='block';loadInbox();}
async function renderChat(){if(!CUR)return;let {data:u}=await sb.from('users').select('*').eq('username',CUR).single();let on=u&&Date.now()-u.last_seen<120000;let {data}=await sb.from('secret_messages').select('*').or(`and(from_user.eq.${ME.username},to_user.eq.${CUR}),and(from_user.eq.${CUR},to_user.eq.${ME.username})`).order('created_at',{ascending:true});document.getElementById('chatMsgs').innerHTML=(data||[]).map(m=>{let me=m.from_user==ME.username;let tick=me?(m.read?'<span style="color:#1e90ff">✓✓ read blue</span>':(on?'<span>✓✓ delivered</span>':'<span>✓ sent (offline)</span>')):'';return `<div class="bubble ${me?'me':'other'}">${mediaTag(m.image)}<div>${m.text||''}</div><div style="display:flex;justify-content:space-between;margin-top:4px"><small>${tick}</small><small>${me?`<span onclick="delMsg(${m.id})" style="color:#500">Delete</span> <span onclick="editMsg(${m.id},'${(m.text||'').replace(/'/g,'')}')" style="color:#222">Edit</span>`:''}</small></div></div>`;}).join('');let el=document.getElementById('chatMsgs');el.scrollTop=el.scrollHeight;}
async function delMsg(id){if(!confirm('Delete message?'))return;await sb.from('secret_messages').delete().eq('id',id);renderChat();}
async function editMsg(id,old){let ne=prompt('Edit message:',old);if(!ne)return;await sb.from('secret_messages').update({text:ne}).eq('id',id);renderChat();}
async function loadMyProfile(){document.getElementById('myAvatar').src=ME.avatar;document.getElementById('myName').innerText=ME.username;document.getElementById('myEmail2').innerText=ME.email;let {data}=await sb.from('posts').select('*').eq('username',ME.username).order('created_at',{ascending:false});document.getEl
