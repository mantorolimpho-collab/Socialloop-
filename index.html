<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialLoop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.inputL{background:#111;border:1px solid #2a2a2a;padding:14px 18px;border-radius:14px;color:#fff;width:100%;max-width:360px;margin-top:12px;font-size:16px}
.btnL{background:#c084fc;border:none;padding:16px;border-radius:24px;font-weight:900;width:100%;max-width:360px;margin-top:14px;color:#000;font-size:16px}
.tab{display:flex;gap:20px;margin:14px 0}.tab div{padding:8px 14px;border-bottom:2px solid transparent;color:#666;cursor:pointer;font-weight:600}.tab div.on{color:#fff;border-color:#c084fc}
#msg{color:#ff8fab;margin-top:10px;text-align:center;min-height:20px}
.header{position:sticky;top:0;background:#000;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #222;z-index:10}
.post{background:#0c0c0c;margin:0 0 2px 0;border-bottom:1px solid #1f1f1f}.pHead{display:flex;gap:10px;padding:12px;align-items:center}.pHead img{width:34px;height:34px;border-radius:50%}.pImg img{width:100%;display:block}.pAct{display:flex;gap:16px;padding:10px 12px;font-size:22px}.pCap{padding:0 12px 12px;font-size:14px}
.page{padding:0;display:none;padding-bottom:80px;max-width:600px;margin:0 auto;width:100%}.page.active{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;align-items:center;padding:8px 0 10px;border-top:1px solid #222;max-width:600px;margin:0 auto;width:100%}.ni{color:#666;font-size:12px;text-align:center}.ni.on{color:#c084fc}.plus{background:#c084fc;color:#000;width:54px;height:36px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.chat{height:280px;background:#131313;border-radius:18px;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:12px}.bubble{padding:8px 12px;border-radius:18px;max-width:80%;font-size:13px}.me{background:#c084fc;color:#000;align-self:flex-end}.other{background:#2a2a2a;align-self:flex-start}.row{display:flex;gap:8px;padding:0 12px}.inp{flex:1;background:#1e1e1e;border:none;border-radius:22px;padding:12px 16px;color:#fff}.snd{background:#c084fc;border:none;border-radius:22px;padding:12px 18px;font-weight:800;color:#000}
.searchItem{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222;align-items:center}
</style></head><body>
<div id="login">
<h1 style="font-size:42px;font-weight:900">Social<span style="color:#c084fc">Loop</span></h1>
<p style="color:#666;margin:6px 0 10px">Welcome back</p>
<div class="tab"><div id="tLogin" class="on" onclick="switchTab('login')">Log In</div><div id="tSignup" onclick="switchTab('signup')">Sign Up</div></div>
<div id="loginForm" style="width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center">
<input id="loginInput" class="inputL" placeholder="Email / Username / Phone">
<button class="btnL" onclick="doLogin()">Enter</button>
</div>
<div id="signupForm" style="width:100%;max-width:360px;display:none;flex-direction:column;align-items:center">
<input id="su_email" class="inputL" placeholder="Email">
<input id="su_fullname" class="inputL" placeholder="Full Name e.g Limpho Mantoro">
<input id="su_username" class="inputL" placeholder="Username e.g ausydee">
<input id="su_phone" class="inputL" placeholder="Phone e.g +266...">
<button class="btnL" onclick="doSignup()">Create Account</button>
</div>
<div id="msg"></div>
</div>
<div id="app" style="display:none">
<div class="header"><div style="font-weight:900;font-size:22px">Social<span style="color:#c084fc">Loop</span></div><div onclick="logout()" style="color:#888;font-size:13px">Logout</div></div>
<div id="pageHome" class="page active"><div id="feed"></div><div class="chat" id="chat"></div><div class="row"><input id="msgInp" class="inp" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="snd" onclick="sendMsg()">Send</button></div></div>
<div id="pageSearch" class="page" style="padding:12px"><h3>Search Users</h3><input id="searchInp" class="inputL" placeholder="Search by name, username, email..." oninput="doSearch()" style="max-width:100%"><div id="searchRes" style="margin-top:12px"></div></div>
<div id="pageCreate" class="page" style="padding:16px"><h2>Create Post</h2><input id="capInp" class="inputL" placeholder="Write a caption... Limpho Mantoro" style="max-width:100%"><input type="file" id="fileInp" accept="image/*" style="margin:14px 0"><button class="btnL" style="max-width:100%" onclick="createPost()">Share Post</button><p id="postStatus" style="color:#c084fc;margin-top:10px"></p></div>
<div id="pageProfile" class="page" style="padding:0"><div id="profileBox" style="padding:20px;text-align:center"></div><div id="myPosts"></div></div>
<div class="nav"><div class="ni on" id="nHome" onclick="nav('Home')">Home</div><div class="ni" id="nSearch" onclick="nav('Search')">Search</div><div class="plus" onclick="nav('Create')">+</div><div class="ni" id="nProfile" onclick="nav('Profile')">Profile</div></div></div>
<script>
const URL='https://ysfjnpyhwogfjkdzruqz.supabase.co';const KEY='sb_publishable_MMVTip9_ZpJOpyilnXPF3w_SnXHgnfL';let supa=null;try{supa=supabase.createClient(URL,KEY);}catch(e){}
let ME=null;let POSTS=JSON.parse(localStorage.getItem('sl_posts')||'[]');
function showMsg(t){document.getElementById('msg').innerText=t;}
function switchTab(t){document.getElementById('loginForm').style.display=t==='login'?'flex':'none';document.getElementById('signupForm').style.display=t==='signup'?'flex':'none';document.getElementById('tLogin').className=t==='login'?'on':'';document.getElementById('tSignup').className=t==='signup'?'on':'';}
async function doSignup(){
 const email=document.getElementById('su_email').value.trim();
 const fullName=document.getElementById('su_fullname').value.trim();
 let username=document.getElementById('su_username').value.trim().toLowerCase();
 const phone=document.getElementById('su_phone').value.trim();
 if(!email||!username){showMsg('Email + username needed');return;}
 if(username.includes(' ')){showMsg('Username no spaces. Full name CAN have space');return;}
 ME={id:Date.now().toString(),username:username,email:email.toLowerCase(),phone:phone,full_name:fullName,avatar:'https://i.pravatar.cc/150?u='+username};
 localStorage.setItem('sl_user',JSON.stringify(ME));
 let all=JSON.parse(localStorage.getItem('sl_all_users')||'[]');all=all.filter(u=>u.username!==username);all.push(ME);localStorage.setItem('sl_all_users',JSON.stringify(all));
 if(supa){supa.from('profiles').insert([{id:crypto.randomUUID(),username:username,email:email.toLowerCase(),phone:phone,full_name:fullName,avatar:ME.avatar}]).then(()=>{});}
 document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();
}
async function doLogin(){
 const q=document.getElementById('loginInput').value.trim().toLowerCase();
 if(!q){showMsg('Type login');return;}
 let all=JSON.parse(localStorage.getItem('sl_all_users')||'[]');
 let found=all.find(u=>u.username===q||u.email===q||u.phone===q||(u.full_name&&u.full_name.toLowerCase()===q));
 if(found){ME=found;localStorage.setItem('sl_user',JSON.stringify(ME));document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();return;}
 if(supa){try{const{data}=await supa.from('profiles').select('*').or(`username.eq.${q},email.eq.${q},phone.eq.${q}`).maybeSingle();if(data){ME=data;localStorage.setItem('sl_user',JSON.stringify(ME));document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();return;}}catch(e){}}
 // auto-create if not found
 ME={id:Date.now().toString(),username:q.split('@')[0],email:q.includes('@')?q:'',phone:q.startsWith('+')?q:'',full_name:q.includes('@')?'Limpho Mantoro':q,avatar:'https://i.pravatar.cc/150?u='+q};
 localStorage.setItem('sl_user',JSON.stringify(ME));document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();
}
function logout(){localStorage.removeItem('sl_user');location.reload();}
function nav(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('page'+p).classList.add('active');document.querySelectorAll('.ni').forEach(e=>e.classList.remove('on'));let el=document.getElementById('n'+p);if(el)el.classList.add('on');if(p==='Profile')loadProfile();}
function renderPosts(list){const f=document.getElementById('feed');f.innerHTML='';if(list.length===0){f.innerHTML='<div style="text-align:center;padding:40px;color:#666"><p>No posts yet</p><p>Tap + to create first post as Limpho Mantoro</p></div>';return;}list.forEach(po=>{f.innerHTML+=`<div class="post"><div class="pHead"><img src="${po.avatar||'https://i.pravatar.cc/150?u='+po.username}"><div><div style="font-weight:700">${po.full_name||po.username}</div><div style="font-size:12px;color:#888">@${po.username}</div></div></div>${po.image_url?`<div class="pImg"><img src="${po.image_url}"></div>`:''}<div class="pAct">❤️ 💬 ✈️</div><div class="pCap"><b>${po.username}</b> ${po.caption||''}</div></div>`;});}
async function loadFeed(){
 if(supa){try{const{data}=await supa.from('posts').select('*').order('created_at',{ascending:false}).limit(30);if(data&&data.length>0){renderPosts(data);return;}}catch(e){}}
 renderPosts(POSTS.slice().reverse());
}
async function createPost(){
 const cap=document.getElementById('capInp').value.trim();const file=document.getElementById('fileInp').files[0];let imgUrl='';let base64='';
 if(file){base64=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file);});imgUrl=base64;if(supa){try{const name=Date.now()+'_'+file.name;await supa.storage.from('post-images').upload(name,file);imgUrl=supa.storage.from('post-images').getPublicUrl(name).data.publicUrl;}catch(e){}}}
 const newPost={id:Date.now(),username:ME.username,full_name:ME.full_name,caption:cap,image_url:imgUrl,avatar:ME.avatar,created_at:new Date().toISOString()};
 POSTS.push(newPost);localStorage.setItem('sl_posts',JSON.stringify(POSTS));
 if(supa){try{await supa.from('posts').insert([{user_id:ME.id,username:ME.username,caption:cap,image_url:imgUrl}]);}catch(e){}}
 document.getElementById('postStatus').innerText='Posted as '+ME.full_name+'!';loadFeed();nav('Home');
}
function addMsg(r){const c=document.getElementById('chat');const d=document.createElement('div');d.className='bubble '+(r.username===ME.username?'me':'other');d.innerText=`@${r.username}: ${r.text}`;c.appendChild(d);c.scrollTop=c.scrollHeight;}
async function loadChat(){if(!supa)return;try{const{data}=await supa.from('messages').select('*').order('created_at',{ascending:true}).limit(50);document.getElementById('chat').innerHTML='';if(data)data.forEach(addMsg);}catch(e){}}
async function sendMsg(){const e=document.getElementById('msgInp'),t=e.value.trim();if(!t)return;e.value='';addMsg({username:ME.username,text:t});if(supa)await supa.from('messages').insert([{text:t,username:ME.username,mode:'live'}]);}
function doSearch(){const q=(document.getElementById('searchInp')?.value||'').toLowerCase();let all=JSON.parse(localStorage.getItem('sl_all_users')||'[]');let filtered=all;if(q)filtered=all.filter(u=> (u.username&&u.username.includes(q))||(u.email&&u.email.includes(q))||(u.full_name&&u.full_name.toLowerCase().includes(q)));const res=document.getElementById('searchRes');res.innerHTML='';filtered.forEach(u=>{res.innerHTML+=`<div class="searchItem"><div style="display:flex;gap:10px;align-items:center"><img src="${u.avatar}" style="width:38px;height:38px;border-radius:50%"><div><div style="font-weight:700">${u.full_name||u.username}</div><div style="font-size:12px;color:#888">@${u.username} • ${u.email}</div></div></div><div style="background:#c084fc;color:#000;padding:6px 14px;border-radius:16px;font-weight:700">Follow</div></div>`;});}
function loadProfile(){document.getElementById('profileBox').innerHTML=`<img src="${ME.avatar}" style="width:86px;height:86px;border-radius:50%;border:2px solid #c084fc"><h2 style="margin-top:10px">${ME.full_name||ME.username}</h2><p style="color:#888">@${ME.username}</p><p style="color:#666;font-size:13px;margin-top:4px">${ME.email} ${ME.phone||''}</p><div style="display:flex;justify-content:center;gap:24px;margin-top:16px"><div><b>${POSTS.filter(p=>p.username===ME.username).length}</b><br><span style="color:#888;font-size:12px">Posts</span></div><div><b>0</b><br><span style="color:#888;font-size:12px">Followers</span></div><div><b>0</b><br><span style="color:#888;font-size:12px">Following</span></div></div>`;}
function init(){loadProfile();loadFeed();loadChat();doSearch();}
const saved=localStorage.getItem('sl_user');if(saved){ME=JSON.parse(saved);document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();}
</script></body></html>
