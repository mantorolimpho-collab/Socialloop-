<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>SocialLoop Pro</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff;height:100dvh;display:flex;flex-direction:column}.inputL{background:#111;border:1px solid #2a2a2a;padding:14px 18px;border-radius:14px;color:#fff;width:100%;max-width:360px;margin-top:12px;font-size:16px;outline:none}.btnL{background:#c084fc;border:none;padding:14px;border-radius:24px;font-weight:900;width:100%;max-width:360px;margin-top:12px;color:#000;cursor:pointer}.header{position:sticky;top:0;background:#000;padding:10px 14px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;z-index:10}.page{display:none;flex:1;overflow-y:auto;max-width:600px;margin:0 auto;width:100%;padding-bottom:90px}.page.active{display:flex;flex-direction:column}.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 12px;max-width:600px;margin:0 auto;width:100%;z-index:20}.ni{color:#666;font-size:11px;text-align:center;cursor:pointer}.ni.on{color:#c084fc}.chatArea{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#0a0a0a;min-height:200px}.bubble{padding:10px 14px;border-radius:18px;max-width:78%;font-size:13px}.me{background:#c084fc;color:#000;align-self:flex-end}.other{background:#222;align-self:flex-start}.bubble img{max-width:180px;border-radius:10px;margin-top:5px;display:block}.row{display:flex;gap:8px;padding:10px;background:#111;border-top:1px solid #222;align-items:center;position:sticky;bottom:0;width:100%;z-index:15}.inp{flex:1;background:#1e1e1e;border:1px solid #333;border-radius:22px;padding:14px 14px;color:#fff;outline:none;font-size:16px}.snd{background:#c084fc;border:none;border-radius:20px;padding:12px 18px;font-weight:800;color:#000;cursor:pointer}.post{background:#0c0c0c;border-bottom:1px solid #1f1f1f;padding-bottom:8px}.pHead{display:flex;gap:10px;padding:10px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:#333;display:inline-block}.dot.on{background:#25D366;box-shadow:0 0 6px #25D366}</style></head><body>
<div id="login" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px"><h1 style="font-size:38px;font-weight:900">Social<span style="color:#c084fc">Loop</span> Pro</h1><input id="loginInput" class="inputL" placeholder="Username or Email" autocomplete="off"><button class="btnL" onclick="doLogin()">Enter</button><div id="msg" style="color:#ff8fab;margin-top:10px"></div><p style="color:#555;font-size:11px;margin-top:10px">Old photos auto-move to cloud</p></div>
<div id="app" style="display:none;flex:1;flex-direction:column;overflow:hidden"><div class="header"><div style="font-weight:900">Social<span style="color:#c084fc">Loop</span></div><div style="display:flex;gap:12px;align-items:center"><span id="notifBell" onclick="nav('Inbox')" style="cursor:pointer">🔔<span id="notifCount" style="background:red;color:#fff;border-radius:10px;padding:1px 5px;font-size:10px;display:none">0</span></span><input id="searchInput" placeholder="Search..." style="background:#111;border:1px solid #222;border-radius:12px;padding:6px 10px;color:#fff;font-size:12px;width:90px" oninput="doSearch()"><span id="myName" style="color:#888;font-size:12px" onclick="nav('Profile')"></span></div></div>
<div id="pageFeed" class="page active"><div id="searchRes"></div><div id="feed"></div></div><div id="pageLiveBox" class="page"><div style="padding:10px;font-weight:800;border-bottom:1px solid #222;flex-shrink:0">Live Box <span class="dot on"></span> Online</div><div id="liveMsgs" class="chatArea"></div><div class="row"><input id="liveInp" class="inp" placeholder="Message everyone..."><label for="liveImg" style="cursor:pointer;font-size:22px">📷</label><input type="file" id="liveImg" accept="image/*" style="display:none" onchange="sendLiveImg(event)"><button class="snd" onclick="sendLive()">Send</button></div></div><div id="pageInbox" class="page"><div style="padding:10px;font-weight:800;border-bottom:1px solid #222;display:flex;justify-content:space-between;flex-shrink:0"><span>Inbox</span><span id="backInbox" style="display:none;color:#c084fc" onclick="closeSecret()">Back</span></div><div id="inboxList" style="flex:1;overflow-y:auto"></div><div id="secretBox" style="display:none;flex:1;flex-direction:column;overflow:hidden"><div id="secretName" style="padding:10px;font-weight:700;border-bottom:1px solid #222;flex-shrink:0"></div><div id="secretMsgs" class="chatArea"></div><div class="row"><input id="secretInp" class="inp" placeholder="Type message..."><label for="secretImg" style="cursor:pointer;font-size:22px">📷</label><input type="file" id="secretImg" accept="image/*" style="display:none" onchange="sendSecretImg(event)"><button class="snd" onclick="sendSecret()">Send</button></div></div></div><div id="pageReels" class="page"><div id="reelsList" style="flex:1"></div><div class="row"><input id="reelComment" class="inp" placeholder="Comment on reel..."><button class="snd" onclick="commentReel()">Send</button></div></div><div id="pageStatus" class="page"><div id="statusBar" style="display:flex;gap:10px;padding:10px;overflow-x:auto"></div></div><div id="pageCreate" class="page" style="padding:16px"><h3>Create</h3><div style="display:flex;gap:6px;margin:10px 0"><button onclick="setMode('post')" id="bmPost" style="background:#c084fc;color:#000;border:none;padding:6px 12px;border-radius:16px">Post</button><button onclick="setMode('reel')" id="bmReel" style="background:#222;color:#fff;border:none;padding:6px 12px;border-radius:16px">Reels</button><button onclick="setMode('status')" id="bmStatus" style="background:#222;color:#fff;border:none;padding:6px 12px;border-radius:16px">Status</button></div><input id="capInp" class="inputL" placeholder="Caption..." style="max-width:100%"><input type="file" id="fileInp" accept="image/*,video/*" style="margin:10px 0"><button class="btnL" style="max-width:100%" onclick="doCreate()">Share</button><p id="createMsg" style="color:#c084fc"></p></div><div id="pageProfile" class="page" style="padding:16px;text-align:center"><div id="profileBox"></div></div>
<div class="nav"><div class="ni on" id="nFeed" onclick="nav('Feed')">🏠<br>Feed</div><div class="ni" id="nLiveBox" onclick="nav('LiveBox')">🔴<br>Live</div><div class="ni"><div style="background:#c084fc;color:#000;width:44px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900" onclick="nav('Create')">+</div></div><div class="ni" id="nReels" onclick="nav('Reels')">🎬<br>Reels</div><div class="ni" id="nInbox" onclick="nav('Inbox')">📩<br>Inbox</div></div></div>
<script>
const SUPA_URL = "https://ysfjnpyhwogfjkdzruqz.supabase.co";
const SUPA_KEY = "sb_publishable_MMVTip9_ZpJOpyilnXPF3w_SnXHgnfL";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
let ME=null, CUR=null, MODE='post', CUR_REEL=null;
let OLD_POSTS=JSON.parse(localStorage.getItem('sl_posts')||'[]');
let OLD_LIVE=JSON.parse(localStorage.getItem('sl_live')||'[]');
async function doLogin(){let q=document.getElementById('loginInput').value.trim().toLowerCase();if(!q){document.getElementById('msg').innerText='Type email/username';return;}let {data}=await sb.from('users').select('*').or(`username.eq.${q},email.eq.${q}`).limit(1);if(data&&data[0])ME=data[0];else{ME={id:Date.now().toString(), username:q.split('@')[0].replace(/\s+/g,''), full_name:q.includes('@')?'Limpho Mantoro':q, email:q.includes('@')?q:'', avatar:'https://i.pravatar.cc/150?u='+q, online:true, last_seen:Date.now()};await sb.from('users').insert(ME);}localStorage.setItem('sl_user',JSON.stringify(ME));document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';if(OLD_POSTS.length>0){for(let o of OLD_POSTS){await sb.from('posts').insert({user_id:ME.id, username:ME.username, full_name:ME.full_name, avatar:ME.avatar, caption:o.cap||'', image:o.img||'', type:o.type||'post', created_at:o.time||Date.now()});}localStorage.removeItem('sl_posts');OLD_POSTS=[];}if(OLD_LIVE.length>0){for(let o of OLD_LIVE){await sb.from('live_messages').insert({username:o.from, text:o.text||'', image:o.img||'', created_at:o.time||Date.now()});}localStorage.removeItem('sl_live');OLD_LIVE=[];}init();setInterval(()=>sb.from('users').update({online:true, last_seen:Date.now()}).eq('id',ME.id),30000);}
function nav(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));let pg=document.getElementById('page'+p);pg.classList.add('active');if(p!=='Feed')pg.style.display='flex';document.querySelectorAll('.ni').forEach(e=>e.classList.remove('on'));let el=document.getElementById('n'+p);if(el)el.classList.add('on');if(p==='Feed'){pg.style.display='block';loadFeed();}if(p==='LiveBox')loadLive();if(p==='Inbox')loadInbox();if(p==='Reels')loadReels();if(p==='Profile'){pg.style.display='block';loadProfile();} setTimeout(()=>{let inp=pg.querySelector('.inp');if(inp)inp.scrollIntoView({block:'center'});},300);}
function setMode(m){MODE=m;['post','reel','status'].forEach(x=>{let b=document.getElementById('bm'+x.charAt(0).toUpperCase()+x.slice(1));if(!b)return;b.style.background=x===m?'#c084fc':'#222';b.style.color=x===m?'#000':'#fff';});}
async function loadFeed(){let {data:posts}=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(50);let {data:likes}=await sb.from('likes').select('*');let {data:comments}=await sb.from('comments').select('*');let {data:blocks}=await sb.from('blocks').select('*').eq('blocker',ME.username);let blocked=blocks?blocks.map(b=>b.blocked):[];let f=document.getElementById('feed');f.innerHTML='';for(let p of posts||[]){if(blocked.includes(p.username))continue;let lc=likes?likes.filter(l=>l.post_id===p.id).length:0;let isLiked=likes?likes.some(l=>l.post_id===p.id&&l.username===ME.username):false;let cc=comments?comments.filter(c=>c.post_id===p.id):[];f.innerHTML+=`<div class="post"><div class="pHead"><img src="${p.avatar}" style="width:34px;height:34px;border-radius:50%"><div style="flex:1"><b>${p.full_name||p.username}</b> <span class="dot on"></span><br><small style="color:#888">@${p.username}</small></div><div><button onclick="toggleFollow('${p.username}')" style="background:#222;color:#fff;border:none;padding:4px 8px;border-radius:12px;font-size:11px">Follow</button> ${p.username===ME.username?`<button onclick="deletePost(${p.id})" style="background:#300;color:#f88;border:none;padding:4px 6px;border-radius:8px">🗑️</button>`:''} <button onclick="blockUser('${p.username}')" style="background:#111;color:#888;border:none;padding:4px 6px;border-radius:8px">🚫</button> <button onclick="reportUser('${p.username}',${p.id})" style="background:#111;color:#666;border:none;padding:4px 6px;border-radius:8px">⚠️</button></div></div>${p.image?`<img src="${p.image}" style="width:100%">`:''}<div style="padding:8px 12px">${p.caption||''}</div><div style="display:flex;gap:14px;padding:6px 12px;border-top:1px solid #1a1a1a"><span onclick="likePost(${p.id})" style="cursor:pointer">${isLiked?'❤️':'🤍'} ${lc} Like</span><span onclick="document.getElementById('cbox${p.id}').style.display='flex'" style="cursor:pointer">💬 ${cc.length} Comment</span></div><div id="cbox${p.id}" style="display:none;padding:8px;gap:6px"><input id="cinp${p.id}" class="inp" placeholder="Comment..." style="position:static"><button class="snd" style="position:static" onclick="addComment(${p.id})">Send</button></div><div style="padding:0 12px 8px">${cc.map(c=>`<div style="font-size:12px;margin:4px 0"><b>${c.username}:</b> ${c.text}</div>`).join('')}</div></div>`;}}
async function likePost(id){let {data}=await sb.from('likes').select('*').eq('post_id',id).eq('username',ME.username);if(data&&data.length>0){await sb.from('likes').delete().eq('post_id',id).eq('username',ME.username);}else{await sb.from('likes').insert({post_id:id, username:ME.username, created_at:Date.now()});}loadFeed();}
async function addComment(pid){let inp=document.getElementById('cinp'+pid);let t=inp.value.trim();if(!t)return;await sb.from('comments').insert({post_id:pid, username:ME.username, full_name:ME.full_name, text:t, created_at:Date.now()});inp.value='';loadFeed();}
async function deletePost(id){if(!confirm('Delete your post?'))return;await sb.from('posts').delete().eq('id',id);loadFeed();}
async function blockUser(u){if(!confirm('Block '+u+'?'))return;await sb.from('blocks').insert({blocker:ME.username, blocked:u});alert('Blocked');loadFeed();}
async function reportUser(u,pid){let r=prompt('Reason?');if(!r)return;alert('Reported');}
async function toggleFollow(u){if(u===ME.username)return;let {data}=await sb.from('follows').select('*').eq('follower',ME.username).eq('following',u);if(data&&data.length>0){await sb.from('follows').delete().eq('follower',ME.username).eq('following',u);alert('Unfollowed');}else{await sb.from('follows').insert({follower:ME.username, following:u, created_at:Date.now()});alert('Following '+u);}}
async function doSearch(){let q=document.getElementById('searchInput').value.trim().toLowerCase();if(q.length<2){document.getElementById('searchRes').innerHTML='';return;}let {data}=await sb.from('users').select('*').ilike('username','%'+q+'%').limit(10);let res=document.getElementById('searchRes');res.innerHTML=(data||[]).map(u=>`<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #222"><div style="display:flex;gap:8px;align-items:center"><img src="${u.avatar}" style="width:36px;height:36px;border-radius:50%"><div><b>${u.full_name}</b> <span class="dot ${u.online?'on':''}"></span> ${u.online?'Online':'Offline'}<br><small>@${u.username}</small></div></div><button onclick="toggleFollow('${u.username}')" style="background:#c084fc;border:none;padding:6px 10px;border-radius:12px">Follow</button></div>`).join('');}
async function loadLive(){let {data}=await sb.from('live_messages').select('*').order('created_at',{ascending:true}).limit(100);let c=document.getElementById('liveMsgs');c.innerHTML=(data||[]).map(m=>`<div class="bubble ${m.username===ME.username?'me':'other'}"><b style="font-size:10px">${m.username}</b><br>${m.text||''}${m.image?`<img src="${m.image}">`:''}<br><small style="font-size:9px">${m.username===ME.username?'✓✓ delivered':''}</small></div>`).join('');c.scrollTop=c.scrollHeight;}
async function sendLive(){let e=document.getElementById('liveInp');let t=e.value.trim();if(!t)return;e.value='';await sb.from('live_messages').insert({username:ME.username, text:t, created_at:Date.now()});loadLive();}
async function sendLiveImg(ev){let file=ev.target.files[0];if(!file)return;let fr=new FileReader();fr.onload=async()=>{await sb.from('live_messages').insert({username:ME.username, image:fr.result, created_at:Date.now()});loadLive();};fr.readAsDataURL(file);}
async function loadInbox(){let {data:users}=await sb.from('users').select('*');let list=document.getElementById('inboxList');list.innerHTML='';document.getElementById('secretBox').style.display='none';document.getElementById('backInbox').style.display='none';list.style.display='block';document.getElementById('secretBox').style.flex='1';(users||[]).filter(u=>u.username!==ME.username).forEach(u=>{let on=u.online?`<span class="dot on"></span> Online`:`<span class="dot"></span> Offline`;list.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222" onclick="openSecret('${u.username}')"><div style="display:flex;gap:8px;align-items:center"><img src="${u.avatar}" style="width:40px;height:40px;border-radius:50%"><div><b>${u.full_name||u.username}</b><br><small style="color:#888">${on}</small></div></div><span>💬</span></div>`;});let {data:unread}=await sb.from('secret_messages').select('*').eq('to_user',ME.username).eq('read',false);let bell=document.getElementById('notifCount');if(unread&&unread.length>0){bell.style.display='inline';bell.innerText=unread.length;}else bell.style.display='none';}
async function openSecret(un){CUR=un;document.getElementById('inboxList').style.display='none';document.getElementById('secretBox').style.display='flex';document.getElementById('backInbox').style.display='block';document.getElementById('secretName').innerText='Chat with '+un;renderSecret();await sb.from('secret_messages').update({read:true}).eq('to_user',ME.username).eq('from_user',un); setTimeout(()=>document.getElementById('secretInp').focus(),300);}
function closeSecret(){CUR=null;document.getElementById('secretBox').style.display='none';document.getElementById('inboxList').style.display='block';document.getElementById('backInbox').style.display='none';loadInbox();}
async function renderSecret(){if(!CUR)return;let {data}=await sb.from('secret_messages').select('*').or(`and(from_user.eq.${ME.username},to_user.eq.${CUR}),and(from_user.eq.${CUR},to_user.eq.${ME.username})`).order('created_at',{ascending:true});let c=document.getElementById('secretMsgs');c.innerHTML=(data||[]).map(m=>`<div class="bubble ${m.from_user===ME.username?'me':'other'}">${m.text||''}${m.image?`<img src="${m.image}">`:''}<br><small style="font-size:9px">${m.from_user===ME.username?(m.read?'✓✓ read':m.delivered?'✓✓ delivered':'✓ sent'):''} <button onclick="deleteMsg(${m.id})" style="background:none;border:none;color:#888;font-size:10px">delete</button></small></div>`).join('');c.scrollTop=c.scrollHeight;}
async function sendSecret(){let e=document.getElementById('secretInp');let t=e.value.trim();if(!t||!CUR)return;e.value='';await sb.from('secret_messages').insert({from_user:ME.username, to_user:CUR, text:t, delivered:true, read:false, created_at:Date.now()});renderSecret();}
async function sendSecretImg(ev){let file=ev.target.files[0];if(!file||!CUR)return;let fr=new FileReader();fr.onload=async()=>{await sb.from('secret_messages').insert({from_user:ME.username, to_user:CUR, image:fr.result, delivered:true, read:false, created_at:Date.now()});renderSecret();};fr.readAsDataURL(file);}
async function deleteMsg(id){await sb.from('secret_messages').delete().eq('id',id);renderSecret();}
async function loadReels(){let {data}=await sb.from('posts').select('*').eq('type','reel').order('created_at',{ascending:false});CUR_REEL=data&&data[0]?data[0].id:null;document.getElementById('reelsList').innerHTML=(data||[]).map(p=>`<div style="min-height:60vh;position:relative;background:#000;border-bottom:1px solid #222" onclick="setReel(${p.id})"><img src="${p.image}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:12px;left:10px"><b>@${p.username}</b> <span class="dot on"></span><br>${p.caption}</div></div>`).join('');}
function setReel(id){CUR_REEL=id;document.getElementById('reelComment').focus();}
async function commentReel(){let e=document.getElementById('reelComment');let t=e.value.trim();if(!t||!CUR_REEL)return;e.value='';await sb.from('comments').insert({post_id:CUR_REEL, username:ME.username, full_name:ME.full_name, text:t, created_at:Date.now()});alert('Comment added');}
async function loadProfile(){document.getElementById('profileBox').innerHTML=`<img src="${ME.avatar}" style="width:80px;height:80px;border-radius:50%;border:2px solid #c084fc"><h2>${ME.full_name}</h2><p style="color:#888">@${ME.username}</p><p style="color:#555">${ME.email}</p><p style="margin-top:8px"><span class="dot on"></span> Online • Green dot active</p><button onclick="logout()" style="margin-top:12px;background:#222;color:#fff;border:none;padding:8px 16px;border-radius:16px">Logout (data stays in cloud)</button>`;document.getElementById('myName').innerText=ME.full_name;}
async function doCreate(){let cap=document.getElementById('capInp').value.trim();let file=document.getEle
