<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>SocialLoop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff;height:100dvh;display:flex;flex-direction:column}.inputL{background:#e8efff;border:none;padding:16px 20px;border-radius:14px;color:#000;width:100%;max-width:360px;margin-top:12px;font-size:15px;outline:none}.btnL{background:#c084fc;border:none;padding:16px;border-radius:28px;font-weight:900;width:100%;max-width:360px;margin-top:14px;color:#000;cursor:pointer}.header{padding:14px 16px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center;background:#000;position:sticky;top:0;z-index:10}.page{display:none;flex:1;overflow-y:auto;max-width:600px;margin:0 auto;width:100%;padding-bottom:90px;flex-direction:column}.page.on{display:flex}.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;padding:8px 0 12px;max-width:600px;margin:0 auto;width:100%;z-index:20}.ni{color:#555;font-size:10px;text-align:center;cursor:pointer;line-height:12px}.ni.on{color:#c084fc}.plus{background:#c084fc;color:#000;width:36px;height:28px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}.statusRow{display:flex;gap:16px;padding:16px;align-items:center;border-bottom:1px solid #111}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover}.addStatus{width:58px;height:58px;border-radius:50%;background:#1a1a1a;border:1px dashed #444;display:flex;align-items:center;justify-content:center;font-size:22px;color:#777}.liveCard{border:3px solid #c084fc;border-radius:18px;padding:6px;margin:12px;background:#0a0a0a;position:relative}.liveCard img{width:100%;border-radius:12px;display:block}.dot{width:10px;height:10px;border-radius:50%;background:#333;display:inline-block}.dot.on{background:#25D366;box-shadow:0 0 6px #25D366}.row{display:flex;gap:8px;padding:10px;background:#111;border-top:1px solid #222;align-items:center;position:sticky;bottom:0;width:100%}.inp{flex:1;background:#1e1e1e;border:1px solid #333;border-radius:22px;padding:14px;color:#fff;outline:none;font-size:16px}.snd{background:#c084fc;border:none;border-radius:20px;padding:10px 16px;font-weight:800;color:#000}.pill{padding:6px 14px;border-radius:18px;border:none;font-size:12px;cursor:pointer}.pill.on{background:#c084fc;color:#000;font-weight:700}.pill.off{background:#222;color:#fff}.bubble{padding:10px 14px;border-radius:18px;max-width:78%;font-size:13px}.me{background:#c084fc;color:#000;align-self:flex-end}.other{background:#222;align-self:flex-start}</style></head><body>
<div id="login" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">
<h1 style="font-size:36px;font-weight:900">Social<span style="color:#c084fc">Loop</span></h1>
<input id="loginInput" class="inputL" placeholder="mantorolimpho@gmail.com" value="mantorolimpho@gmail.com">
<button class="btnL" type="button" onclick="doLogin()">Enter</button>
</div>
<div id="app" style="display:none;flex:1;flex-direction:column;overflow:hidden">
<div class="header"><div style="font-weight:900;font-size:18px">Social<span style="color:#c084fc">Loop</span></div><div style="font-size:12px;color:#888" id="topEmail"></div></div>
<div id="pFeed" class="page on"><div id="feed"></div></div>
<div id="pLive" class="page"><div style="padding:14px 16px;font-weight:700;border-bottom:1px solid #111">Live Box <span class="dot on"></span></div><div id="liveList" style="flex:1;overflow-y:auto"></div><div class="row"><input id="liveInp" class="inp" placeholder="Message everyone..."><label for="liveImg" style="font-size:20px">📷</label><input type="file" id="liveImg" accept="image/*" style="display:none" onchange="sendLiveImg(event)"><button class="snd" onclick="sendLive()">Send</button></div></div>
<div id="pReels" class="page"><div id="reelsList" style="flex:1"></div><div class="row"><input id="reelInp" class="inp" placeholder="Comment on reel..."><button class="snd" onclick="commentReel()">Send</button></div></div>
<div id="pStatus" class="page"><div class="statusRow"><div><div class="addStatus" onclick="nav('Create')">+</div><div style="font-size:10px;color:#666;margin-top:4px">Add Status</div></div><div style="text-align:center"><img id="myAvatar" class="avatar" style="border:2px solid #c084fc"><div style="font-size:11px;margin-top:4px" id="myEmail2"></div></div></div><div style="padding:16px"><b>Status</b><br><small style="color:#666">Disappears after 24 hours</small><div id="statusList" style="margin-top:12px;display:flex;gap:10px;overflow-x:auto"></div></div></div>
<div id="pInbox" class="page"><div style="padding:14px 16px;font-weight:700;border-bottom:1px solid #111;display:flex;justify-content:space-between"><span>Inbox</span><span id="backBtn" style="display:none;color:#c084fc" onclick="closeChat()">Back</span></div><div id="inboxList" style="flex:1;overflow-y:auto"></div><div id="secretBox" style="display:none;flex:1;flex-direction:column;overflow:hidden"><div id="secretName" style="padding:10px;font-weight:700;border-bottom:1px solid #222"></div><div id="secretMsgs" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px"></div><div class="row"><input id="secretInp" class="inp" placeholder="Type message..."><button class="snd" onclick="sendSecret()">Send</button></div></div></div>
<div id="pCreate" class="page" style="padding:16px"><h2 style="margin-bottom:12px">Create</h2><div style="display:flex;gap:8px;margin-bottom:12px"><button class="pill on" id="bPost" onclick="setM('post')">Post</button><button class="pill off" id="bReel" onclick="setM('reel')">Reels</button><button class="pill off" id="bStatus" onclick="setM('status')">Status</button></div><input id="cCap" class="inputL" placeholder="Caption..." style="max-width:100%;background:#1a1a1a;color:#fff;border:1px solid #333"><input type="file" id="cFile" accept="image/*,video/*" style="margin:14px 0;color:#888"><button class="btnL" style="max-width:100%" onclick="doCreate()">Share Now</button><p id="cMsg" style="color:#c084fc;margin-top:10px"></p></div>
<div class="nav"><div class="ni on" id="nFeed" onclick="nav('Feed')">🏠<br>Feed</div><div class="ni" id="nLive" onclick="nav('Live')">🔴<br>Live Box</div><div class="ni" onclick="nav('Create')"><div class="plus">+</div></div><div class="ni" id="nReels" onclick="nav('Reels')">🎬<br>Reels</div><div class="ni" id="nStatus" onclick="nav('Status')">⭕<br>Status</div><div class="ni" id="nInbox" onclick="nav('Inbox')">📩<br>Inbox</div></div>
</div>
<script>
const SUPA_URL="https://ysfjnpyhwogfjkdzruqz.supabase.co";const SUPA_KEY="sb_publishable_MMVTip9_ZpJOpyilnXPF3w_SnXHgnfL";let sb=null;try{sb=supabase.createClient(SUPA_URL,SUPA_KEY);}catch(e){}
let ME=null,MODE='post',CUR=null,CUR_REEL=null;
function doLogin(){
 let input=document.getElementById('loginInput');
 let q=(input.value||'').trim().toLowerCase()||'mantorolimpho@gmail.com';
 ME={id:Date.now().toString(),username:q.split('@')[0].replace(/\s+/g,''),email:q,full_name:q,avatar:'https://i.pravatar.cc/150?u='+q,online:true,last_seen:Date.now()};
 localStorage.setItem('sl_user',JSON.stringify(ME));
 document.getElementById('login').style.display='none';
 document.getElementById('app').style.display='flex';
 document.getElementById('topEmail').innerText=q;
 document.getElementById('myEmail2').innerText=q;
 document.getElementById('myAvatar').src=ME.avatar;
 init();
 if(sb){ try{ sb.from('users').upsert(ME).then(()=>{}).catch(()=>{}); }catch(e){} }
}
function setM(m){MODE=m;document.getElementById('bPost').className=m==='post'?'pill on':'pill off';document.getElementById('bReel').className=m==='reel'?'pill on':'pill off';document.getElementById('bStatus').className=m==='status'?'pill on':'pill off';}
function nav(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));document.getElementById('p'+p).classList.add('on');document.querySelectorAll('.ni').forEach(e=>e.classList.remove('on'));let el=document.getElementById('n'+p);if(el)el.classList.add('on');if(p==='Feed')loadFeed();if(p==='Live')loadLive();if(p==='Reels')loadReels();if(p==='Status')loadStatus();if(p==='Inbox')loadInbox();}
async function loadFeed(){if(!sb) return;let {data:posts}=await sb.from('posts').select('*').eq('type','post').order('created_at',{ascending:false}).limit(50);let {data:likes}=await sb.from('likes').select('*');let {data:comments}=await sb.from('comments').select('*');let {data:blocks}=await sb.from('blocks').select('*').eq('blocker',ME.username);let {data:users}=await sb.from('users').select('*');let blocked=(blocks||[]).map(b=>b.blocked);let f=document.getElementById('feed');if(!posts||posts.length===0){f.innerHTML='<div style="padding:40px;text-align:center;color:#666">No posts yet<br>Tap + to create first post</div>';return;}f.innerHTML=posts.filter(p=>!blocked.includes(p.username)).map(p=>{let u=users?.find(x=>x.username===p.username);let isOnline=u && (Date.now()-u.last_seen<120000);let lc=(likes||[]).filter(l=>l.post_id===p.id).length;let isLiked=(likes||[]).some(l=>l.post_id===p.id&&l.username===ME.username);let cc=(comments||[]).filter(c=>c.post_id===p.id);return `<div style="border-bottom:1px solid #111"><div style="display:flex;gap:8px;padding:10px;align-items:center"><img src="${p.avatar}" style="width:32px;height:32px;border-radius:50%"><div style="flex:1"><b>${p.username}</b> <span class="dot ${isOnline?'on':''}"></span></div><div style="display:flex;gap:4px"><button onclick="reportPost(${p.id},'${p.username}')" style="background:#1a1a1a;color:#888;border:none;padding:4px 6px;border-radius:8px;font-size:9px">Report</button><button onclick="blockUser('${p.username}')" style="background:#1a1a1a;color:#888;border:none;padding:4px 6px;border-radius:8px;font-size:9px">Block</button>${p.username===ME.username?`<button onclick="deletePost(${p.id})" style="background:#300;color:#f88;border:none;padding:4px 6px;border-radius:8px;font-size:9px">Delete</button>`:''}</div></div>${p.image?`<img src="${p.image}" style="width:100%">`:''}<div style="padding:8px 12px">${p.caption||''}</div><div style="display:flex;gap:16px;padding:8px 12px;border-top:1px solid #111"><span onclick="likePost(${p.id})">${isLiked?'❤️':'🤍'} ${lc}</span><span onclick="document.getElementById('cbox${p.id}').style.display=document.getElementById('cbox${p.id}').style.display==='flex'?'none':'flex'">💬 ${cc.length}</span></div><div id="cbox${p.id}" style="display:none;padding:8px;gap:6px;flex-direction:column"><div>${cc.map(c=>`<div style="font-size:12px"><b>${c.username}:</b> ${c.text} ${c.username===ME.username?`<span onclick="deleteComment(${c.id})" style="color:#f55"> x</span>`:''}</div>`).join('')}</div><div style="display:flex;gap:6px"><input id="cinp${p.id}" class="inp" style="padding:10px" placeholder="Comment..."><button class="snd" style="padding:8px 12px" onclick="addComment(${p.id})">Send</button></div></div></div>`;}).join('');}
async function likePost(id){let {data}=await sb.from('likes').select('*').eq('post_id',id).eq('username',ME.username);if(data&&data.length>0)await sb.from('likes').delete().eq('post_id',id).eq('username',ME.username);else await sb.from('likes').insert({post_id:id,username:ME.username,created_at:Date.now()});loadFeed();}
async function addComment(pid){let t=document.getElementById('cinp'+pid).value.trim();if(!t) return;document.getElementById('cinp'+pid).value='';await sb.from('comments').insert({post_id:pid,username:ME.username,text:t,created_at:Date.now()});loadFeed();}
async function deleteComment(id){if(!confirm('Delete?'))return;await sb.from('comments').delete().eq('id',id);loadFeed();}
async function deletePost(id){if(!confirm('Delete?'))return;await sb.from('posts').delete().eq('id',id);loadFeed();loadStatus();loadReels();}
async function blockUser(u){if(!confirm('Block '+u+'?'))return;await sb.from('blocks').insert({blocker:ME.username,blocked:u});loadFeed();}
async function reportPost(id,u){let r=prompt('Report reason?');if(!r)return;await sb.from('reports').insert({post_id:id,reporter:ME.username,reported_user:u,reason:r,created_at:Date.now()});alert('Reported');}
async function loadLive(){if(!sb)return;let {data}=await sb.from('live_messages').select('*').order('created_at',{ascending:true}).limit(80);document.getElementById('liveList').innerHTML=(data||[]).map(m=>`<div class="liveCard"><div style="font-size:11px;color:#aaa">${m.username} <span class="dot on"></span></div>${m.username===ME.username?`<button onclick="deleteLive(${m.id})" style="position:absolute;top:6px;right:6px;background:#300;color:#f88;border:none;padding:2px 6px;border-radius:6px;font-size:9px">X</button>`:''}${m.image?`<img src="${m.image}">`:''}<div style="padding:6px 0">${m.text||''}</div><div style="font-size:10px;color:#666">✓✓ delivered</div></div>`).join('');}
async function deleteLive(id){if(!confirm('Delete?'))return;await sb.from('live_messages').delete().eq('id',id);loadLive();}
async function sendLive(){let t=document.getElementById('liveInp').value.trim();if(!t)return;document.getElementById('liveInp').value='';await sb.from('live_messages').insert({username:ME.username,text:t,created_at:Date.now()});loadLive();}
async function sendLiveImg(ev){let f=ev.target.files[0];if(!f)return;let fr=new FileReader();fr.onload=async()=>{await sb.from('live_messages').insert({username:ME.username,image:fr.result,created_at:Date.now()});loadLive();};fr.readAsDataURL(f);}
async function loadReels(){if(!sb)return;let {data}=await sb.from('posts').select('*').eq('type','reel').order('created_at',{ascending:false});if(!data||data.length===0){document.getElementById('reelsList').innerHTML='<div style="padding:40px;text-align:center;color:#666">No Reels yet<br>Tap + Reels → video</div>';return;}document.getElementById('reelsList').innerHTML=data.map(p=>{CUR_REEL=p.id;return `<div style="height:70vh;border-bottom:1px solid #111;position:relative"><img src="${p.image}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:10px;left:10px"><b>@${p.username}</b> <span class="dot on"></span><br>${p.caption||''}</div></div>`}).join('');}
async function commentReel(){let t=document.getElementById('reelInp').value.trim();if(!t||!CUR_REEL)return;document.getElementById('reelInp').value='';await sb.from('comments').insert({post_id:CUR_REEL,username:ME.username,text:t,created_at:Date.now()});alert('Comment added');}
async function loadStatus(){if(!sb)return;let {data}=await sb.from('posts').select('*').eq('type','status').order('created_at',{ascending:false});let now=Date.now();let valid=(data||[]).filter(p=> now - p.created_at < 86400000);document.getElementById('statusList').innerHTML=valid.map(p=>`<div style="text-align:center;position:relative"><img src="${p.image}" style="width:60px;height:60px;border-radius:50%;border:2px solid #c084fc"><div style="font-size:10px">${p.username}</div>${p.username===ME.username?`<button onclick="deletePost(${p.id})" style="position:absolute;top:0;right:0;background:#300;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px">x</button>`:''}</div>`).join('')||'<div style="color:#555;font-size:12px">No status</div>';}
async function loadInbox(){if(!sb)return;let {data:users}=await sb.from('users').select('*');let {data:msgs}=await sb.from('secret_messages').select('*').eq('to_user',ME.username).eq('read',false);let list=document.getElementById('inboxList');if(!users||users.length<=1){list.innerHTML='<div style="padding:20px;text-align:center;color:#666">Create 2nd account to test inbox</div>';return;}list.innerHTML=users.filter(u=>u.username!==ME.username).map(u=>{let isOnline=Date.now()-u.last_seen<120000;let unread=(msgs||[]).filter(m=>m.from_user===u.username).length;return `<div style="padding:12px;border-bottom:1px solid #111;display:flex;justify-content:space-between" onclick="openChat('${u.username}')"><div style="display:flex;gap:8px;align-items:center"><img src="${u.avatar}" style="width:36px;height:36px;border-radius:50%"><div><b>${u.username}</b> <span class="dot ${isOnline?'on':''}"></span><br><small style="color:${isOnline?'#25D366':'#666'}">${isOnline?'Online':'Offline'}</small></div></div><div>${unread>0?`<span style="background:#c084fc;color:#000;padding:2px 6px;border-radius:10px;font-size:10px">${unread}</span>`:''} 💬</div></div>`;}).join('');}
function openChat(u){CUR=u;document.getElementById('inboxList').style.display='none';document.getElementById('secretBox').style.display='flex';document.getElementById('backBtn').style.display='block';document.getElementById('secretName').innerText=u;renderChat();if(sb)sb.from('secret_messages').update({read:true}).eq('from_user',u).eq('to_user',ME.username).then(()=>{});}
function closeChat(){CUR=null;document.getElementById('secretBox').style.display='none';document.getElementById('inboxList').style.display='block';document.getElementById('backBtn').style.display='none';loadInbox();}
async function renderChat(){if(!sb||!CUR)return;let {data}=await sb.from('secret_messages').select('*').or(`and(from_user.eq.${ME.username},to_user.eq.${CUR}),and(from_user.eq.${CUR},to_user.eq.${ME.username})`).order('created_at',{ascending:true});document.getElementById('secretMsgs').innerHTML=(data||[]).map(m=>{let isMe=m.from_user===ME.username;let tick=isMe?(m.read?'<span style="color:#1e90ff;font-size:11px">✓✓ read</span>':'<span style="color:#888;font-size:11px">✓✓ delivered</span>'):'';return `<div class="bubble ${isMe?'me':'other'}">${m.text||''}<br><div style="display:flex;justify-content:space-between;margin-top:4px"><span>${tick}</span>${isMe?`<button onclick="deleteMsg(${m.id})" style="background:none;border:none;color:#555;font-size:10px">Delete</button>`:''}</div></div>`;}).join('');}
async function deleteMsg(id){if(!confirm('Delete?'))return;await sb.from('secret_messages').delete().eq('id',id);renderChat();}
async function sendSecret(){let t=document.getElementById('secretInp').value.trim();if(!t||!CUR)return;document.getElementById('secretInp').value='';await sb.from('secret_messages').insert({from_user:ME.username,to_user:CUR,text:t,delivered:true,read:false,created_at:Date.now()});renderChat();}
async function doCreate(){let cap=document.getElementById('cCap').value;let file=document.getElementById('cFile').files[0];if(!file){document.getElementById('cMsg').innerText='Choose file';return;}let fr=new FileReader();fr.onload=async()=>{await sb.from('posts').insert({user_id:ME.id,username:ME.username,avatar:ME.avatar,caption:cap,image:fr.result,type:MODE,created_at:Date.now()});document.getElementById('cMsg').innerText='Shared!';if(MODE==='post')nav('Feed');if(MODE==='reel')nav('Reels');if(MODE==='status')nav('Status');};fr.readAsDataURL(file);}
function init(){loadFeed();loadLive();loadReels();loadStatus();loadInbox();}
let saved=localStorage.getItem('sl_user');if(saved){ME=JSON.parse(saved);document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('topEmail').innerText=ME.email;document.getElementById('myEmail2').innerText=ME.email;document.getElementById('myAvatar').src=ME.avatar;init();}
document.getElementById('loginInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script></body></html>
