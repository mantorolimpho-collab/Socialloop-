<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialLoop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.inputL{background:#1a1a1a;border:1px solid #333;padding:14px 18px;border-radius:14px;color:#fff;width:100%;max-width:340px;margin-top:10px;font-size:16px}
.btnL{background:#c084fc;border:none;padding:16px;border-radius:24px;font-weight:900;width:100%;max-width:340px;margin-top:14px;color:#000;font-size:16px}
.tab{display:flex;gap:20px;margin:14px 0}.tab div{padding:6px 12px;border-bottom:2px solid transparent;color:#666;cursor:pointer}.tab div.on{color:#fff;border-color:#c084fc}
#msg{color:#ff8fab;margin-top:10px;text-align:center;min-height:20px}
.header{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #222}
.postCard{background:#0a0a0a;margin:8px 0;border-bottom:1px solid #222}.pHead{display:flex;justify-content:space-between;padding:10px 14px}.pHeadLeft{display:flex;gap:10px;align-items:center}.pHeadLeft img{width:36px;height:36px;border-radius:50%}.pImg img{width:100%;max-height:480px;object-fit:cover}
.page{padding:12px;display:none;padding-bottom:80px}.page.active{display:block}.nav{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222}.ni{color:#666;text-align:center;font-size:11px}.ni.on{color:#c084fc}.plus{background:#c084fc;color:#000;width:52px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}.chat{height:220px;background:#141414;border-radius:16px;padding:8px;overflow-y:auto;margin-top:8px;display:flex;flex-direction:column;gap:6px}.bubble{padding:8px 12px;border-radius:16px;max-width:80%;font-size:13px}.me{background:#c084fc;color:#000;align-self:flex-end}.other{background:#333;align-self:flex-start}.row{display:flex;gap:8px;margin-top:8px}.inp{flex:1;background:#1e1e1e;border:none;border-radius:20px;padding:10px 14px;color:#fff}.snd{background:#c084fc;border:none;border-radius:20px;padding:10px 16px;font-weight:800}
</style></head><body>
<div id="login">
<h1 style="font-size:38px">Social<span style="color:#c084fc">Loop</span></h1>
<div class="tab"><div id="tLogin" class="on" onclick="switchTab('login')">Log In</div><div id="tSignup" onclick="switchTab('signup')">Sign Up</div></div>
<div id="loginForm" style="width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center">
<input id="loginInput" class="inputL" placeholder="Email / Username / Phone">
<button class="btnL" onclick="doLogin()">Enter</button>
</div>
<div id="signupForm" style="width:100%;max-width:340px;display:none;flex-direction:column;align-items:center">
<input id="su_email" class="inputL" placeholder="Email e.g mantorolimpho@gmail.com">
<input id="su_fullname" class="inputL" placeholder="Full Name e.g Limpho Mantoro">
<input id="su_username" class="inputL" placeholder="Username e.g ausydee">
<input id="su_phone" class="inputL" placeholder="Phone e.g +26657530108">
<button class="btnL" onclick="doSignup()">Create Account</button>
</div>
<div id="msg"></div>
</div>
<div id="app" style="display:none">
<div class="header"><div style="font-weight:900;font-size:22px">Social<span style="color:#c084fc">Loop</span></div><div onclick="logout()" style="color:#888">Logout</div></div>
<div id="pageHome" class="page active"><div id="feed">Feed will load here</div><div style="padding:10px"><div class="chat" id="chat"></div><div class="row"><input id="msgInp" class="inp" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="snd" onclick="sendMsg()">Send</button></div></div></div>
<div id="pageSearch" class="page"><h3>Search</h3><input id="searchInp" class="inp" placeholder="Search..." oninput="doSearch()" style="margin:10px 0"><div id="searchRes"></div></div>
<div id="pageCreate" class="page"><h3>Create</h3><input id="capInp" class="inputL" placeholder="Caption..." style="max-width:100%"><input type="file" id="fileInp" accept="image/*" style="margin:12px 0"><button class="btnL" style="max-width:100%" onclick="createPost()">Post Now</button><p id="postStatus"></p></div>
<div id="pageProfile" class="page"><div id="profileBox"></div><div id="myPosts"></div></div>
<div class="nav"><div class="ni on" onclick="nav('Home')">Home</div><div class="ni" onclick="nav('Search')">Search</div><div class="plus" onclick="nav('Create')">+</div><div class="ni" onclick="nav('Profile')">Profile</div></div></div>
<script>
const URL='https://ysfjnpyhwogfjkdzruqz.supabase.co';const KEY='sb_publishable_MMVTip9_ZpJOpyilnXPF3w_SnXHgnfL';let supa=null;try{supa=supabase.createClient(URL,KEY);}catch(e){}
let ME=null;
function showMsg(t){document.getElementById('msg').innerText=t;}
function switchTab(t){document.getElementById('loginForm').style.display=t==='login'?'flex':'none';document.getElementById('signupForm').style.display=t==='signup'?'flex':'none';document.getElementById('tLogin').className=t==='login'?'on':'';document.getElementById('tSignup').className=t==='signup'?'on':'';showMsg('');}
// FAST SIGNUP - Saves instantly on phone!
async function doSignup(){
  const email=document.getElementById('su_email').value.trim();
  const fullName=document.getElementById('su_fullname').value.trim();
  let username=document.getElementById('su_username').value.trim();
  const phone=document.getElementById('su_phone').value.trim();
  if(!email||!username){showMsg('Email and username required');return;}
  if(username.includes(' ')){showMsg('Username no space. Full Name can have space.');return;}
  username=username.toLowerCase();
  ME={id:Date.now().toString(),username:username,email:email.toLowerCase(),phone:phone,full_name:fullName,avatar:'https://i.pravatar.cc/150?u='+username};
  // Save locally instantly
  localStorage.setItem('sl_user',JSON.stringify(ME));
  let all=JSON.parse(localStorage.getItem('sl_all_users')||'[]');
  all=all.filter(u=>u.username!==username); all.push(ME);
  localStorage.setItem('sl_all_users',JSON.stringify(all));
  showMsg('Created! Entering...');
  // Try Supabase in background, but don't wait
  if(supa){supa.from('profiles').insert([{id:crypto.randomUUID(),username:username,email:email.toLowerCase(),phone:phone,full_name:fullName,avatar:ME.avatar}]).then(()=>{});}
  setTimeout(()=>{document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();},500);
}
async function doLogin(){
  const q=document.getElementById('loginInput').value.trim().toLowerCase();
  if(!q){showMsg('Type something');return;}
  showMsg('Checking...');
  // 1. Check local first = INSTANT
  let all=JSON.parse(localStorage.getItem('sl_all_users')||'[]');
  let found=all.find(u=>u.username===q||u.email===q||u.phone===q);
  if(found){ME=found;localStorage.setItem('sl_user',JSON.stringify(ME));document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();return;}
  // 2. Try Supabase with timeout 3 sec
  if(supa){
    try{
      const timeout=new Promise((_,rej)=>setTimeout(()=>rej('timeout'),3000));
      const req=supa.from('profiles').select('*').or(`username.eq.${q},email.eq.${q},phone.eq.${q}`).maybeSingle().then(r=>r.data);
      const data=await Promise.race([req,timeout]);
      if(data){ME=data;localStorage.setItem('sl_user',JSON.stringify(ME));document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();return;}
    }catch(e){ console.log(e); }
  }
  // 3. If not found anywhere, create quick account from login text
  ME={id:Date.now().toString(),username:q.split('@')[0],email:q.includes('@')?q:'',phone:q.startsWith('+')?q:'',full_name:q,avatar:'https://i.pravatar.cc/150?u='+q};
  localStorage.setItem('sl_user',JSON.stringify(ME));
  let all2=JSON.parse(localStorage.getItem('sl_all_users')||'[]'); all2.push(ME); localStorage.setItem('sl_all_users',JSON.stringify(all2));
  document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();
}
function logout(){localStorage.removeItem('sl_user');location.reload();}
function nav(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('page'+p).classList.add('active');}
async function loadFeed(){if(!supa)return;const{data}=await supa.from('posts').select('*').order('created_at',{ascending:false}).limit(20);const f=document.getElementById('feed');if(!data||data.length===0){f.innerHTML='<p style="color:#666;text-align:center;margin-top:20px">No posts yet - be first to post!</p>';return;}f.innerHTML='';data.forEach(po=>{f.innerHTML+=`<div class="postCard"><div class="pHead"><div class="pHeadLeft"><img src="https://i.pravatar.cc/150?u=${po.username}"><b>${po.username}</b></div></div>${po.image_url?`<div class="pImg"><img src="${po.image_url}"></div>`:''}<div style="padding:0 14px 10px">${po.caption||''}</div></div>`});}
async function createPost(){if(!ME)return;const cap=document.getElementById('capInp').value;const file=document.getElementById('fileInp').files[0];let imgUrl='';if(file&&supa){const name=Date.now()+'_'+file.name;document.getElementById('postStatus').innerText='Uploading...';await supa.storage.from('post-images').upload(name,file);imgUrl=supa.storage.from('post-images').getPublicUrl(name).data.publicUrl;}if(supa)await supa.from('posts').insert([{user_id:ME.id,username:ME.username,caption:cap,image_url:imgUrl}]);document.getElementById('postStatus').innerText='Posted!';loadFeed();nav('Home');}
function addMsg(r){const c=document.getElementById('chat'),d=document.createElement('div');d.className='bubble '+(r.username===ME.username?'me':'other');d.innerHTML=`@${r.username}: ${r.text}`;c.appendChild(d);c.scrollTop=c.scrollHeight;}
async function loadChat(){if(!supa)return;const{data}=await supa.from('messages').select('*').eq('mode','live').order('created_at',{ascending:true}).limit(50);document.getElementById('chat').innerHTML='';if(data)data.forEach(addMsg);}
async function sendMsg(){const e=document.getElementById('msgInp'),t=e.value.trim();if(!t)return;e.value='';addMsg({username:ME.username,text:t});if(supa)await supa.from('messages').insert([{text:t,username:ME.username,mode:'live'}]);}
async function doSearch(){const q=(document.getElementById('searchInp')?.value||'').toLowerCase();let all=JSON.parse(localStorage.getItem('sl_all_users')||'[]');let filtered=all;if(q)filtered=all.filter(u=>(u.username&&u.username.includes(q))||(u.email&&u.email.includes(q))||(u.full_name&&u.full_name.toLowerCase().includes(q)));const res=document.getElementById('searchRes');res.innerHTML='';filtered.forEach(u=>{res.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #222"><div><b>${u.full_name||u.username}</b> @${u.username}</div><div>Follow</div></div>`;});}
function loadProfile(){if(!ME)return;document.getElementById('profileBox').innerHTML=`<div style="text-align:center;padding:20px"><img src="https://i.pravatar.cc/150?u=${ME.username}" style="width:80px;height:80px;border-radius:50%"><h2>${ME.full_name||ME.username}</h2><p>@${ME.username}</p><p style="color:#888">${ME.email} ${ME.phone||''}</p></div>`;}
function init(){loadProfile();loadFeed();loadChat();}
const saved=localStorage.getItem('sl_user');if(saved){ME=JSON.parse(saved);document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();}
</script></body></html>
