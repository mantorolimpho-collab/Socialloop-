<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SocialLoop Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;min-height:100vh}
.box{max-width:380px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.input{background:#161616;border:1px solid #333;padding:16px;border-radius:14px;color:#fff;width:100%;margin-top:12px;font-size:16px;outline:none}
.btn{background:#c084fc;border:none;padding:16px;border-radius:28px;font-weight:900;width:100%;margin-top:14px;color:#000;font-size:16px;cursor:pointer}
.link{color:#c084fc;text-align:center;margin-top:14px;cursor:pointer;font-size:14px}
.header{position:sticky;top:0;background:#000;padding:12px;border-bottom:1px solid #222;display:flex;justify-content:space-between;z-index:10}
.page{display:none;max-width:600px;margin:0 auto;width:100%;padding-bottom:90px;flex:1;overflow:auto}.page.on{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;max-width:600px;margin:0 auto}
.ni{color:#666;font-size:11px;text-align:center;cursor:pointer}.ni.on{color:#c084fc}
.chat{padding:12px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.bubble{padding:10px 14px;border-radius:18px;max-width:78%;font-size:14px}
.me{background:#c084fc;color:#000;align-self:flex-end}.other{background:#222;align-self:flex-start}
.row{display:flex;gap:8px;padding:10px;background:#111;border-top:1px solid #222;position:sticky;bottom:0}
.inp{flex:1;background:#1e1e1e;border:1px solid #333;border-radius:22px;padding:14px;color:#fff;outline:none;font-size:16px}
.snd{background:#c084fc;border:none;border-radius:20px;padding:12px 18px;font-weight:800;color:#000}
</style></head><body>

<!-- LOGIN -->
<div id="loginPage" class="box">
<h1 style="font-size:36px;font-weight:900;text-align:center">Social<span style="color:#c084fc">Loop</span> Pro</h1>
<p style="text-align:center;color:#666;font-size:13px;margin-top:6px">Login to continue</p>
<input id="lUser" class="input" placeholder="Username or Email">
<input id="lPass" class="input" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">LOGIN</button>
<div class="link" onclick="showSignup()">Don't have account? <b>Sign Up</b></div>
<div id="lMsg" style="color:#ff7b7b;text-align:center;margin-top:10px;font-size:12px"></div>
</div>

<!-- SIGNUP -->
<div id="signupPage" class="box" style="display:none">
<h1 style="font-size:36px;font-weight:900;text-align:center">Create Account</h1>
<input id="sName" class="input" placeholder="Full Name - e.g Limpho Mantoro">
<input id="sUser" class="input" placeholder="Username - e.g limpho123">
<input id="sEmail" class="input" placeholder="Email - mantorolimpho@gmail.com">
<input id="sPass" class="input" type="password" placeholder="Password">
<button class="btn" onclick="doSignup()">SIGN UP</button>
<div class="link" onclick="showLogin()">Already have account? <b>Login</b></div>
<div id="sMsg" style="color:#ff7b7b;text-align:center;margin-top:10px;font-size:12px"></div>
</div>

<!-- APP -->
<div id="app" style="display:none;flex-direction:column;min-height:100vh">
<div class="header"><b>Social<span style="color:#c084fc">Loop</span></b><span id="myName" style="color:#888;font-size:12px"></span></div>

<div id="pFeed" class="page on"><div id="feed"></div></div>
<div id="pLive" class="page"><div style="padding:10px;font-weight:700;border-bottom:1px solid #222">Live Box 🟢</div><div id="liveList" class="chat"></div><div class="row"><input id="liveInp" class="inp" placeholder="Message everyone..."><button class="snd" onclick="sendLive()">Send</button></div></div>
<div id="pInbox" class="page"><div id="inboxList"></div><div id="secretBox" style="display:none"><div id="secretTitle" style="padding:10px;font-weight:700;border-bottom:1px solid #222"></div><div id="secretMsgs" class="chat"></div><div class="row"><input id="secretInp" class="inp" placeholder="Type..."><button class="snd" onclick="sendSecret()">Send</button></div></div></div>
<div id="pReels" class="page"><div id="reelsList"></div><div class="row"><input id="reelInp" class="inp" placeholder="Comment on reel..."><button class="snd" onclick="commentReel()">Send</button></div></div>
<div id="pCreate" class="page" style="padding:16px"><h3>Create Post / Reel</h3><select id="cType" class="input"><option value="post">Post</option><option value="reel">Reel</option></select><input id="cCap" class="input" placeholder="Caption"><input type="file" id="cFile" accept="image/*,video/*" style="margin:12px 0"><button class="btn" onclick="doCreate()">POST NOW</button><p id="cMsg" style="color:#c084fc"></p></div>

<div class="nav"><div class="ni on" id="nFeed" onclick="nav('Feed')">🏠<br>Feed</div><div class="ni" id="nLive" onclick="nav('Live')">🔴<br>Live</div><div class="ni" onclick="nav('Create')"><div style="background:#c084fc;color:#000;padding:6px 14px;border-radius:10px;font-weight:900">+</div></div><div class="ni" id="nReels" onclick="nav('Reels')">🎬<br>Reels</div><div class="ni" id="nInbox" onclick="nav('Inbox')">📩<br>Inbox</div></div>
</div>

<script>
const SUPA_URL="https://ysfjnpyhwogfjkdzruqz.supabase.co";
const SUPA_KEY="sb_publishable_MMVTip9_ZpJOpyilnXPF3w_SnXHgnfL";
let sb=null; try{sb=supabase.createClient(SUPA_URL,SUPA_KEY);}catch(e){}
let ME=null, CUR_CHAT=null, CUR_REEL=null;

function showSignup(){document.getElementById('loginPage').style.display='none';document.getElementById('signupPage').style.display='flex';}
function showLogin(){document.getElementById('signupPage').style.display='none';document.getElementById('loginPage').style.display='flex';}

function doSignup(){
 let name=document.getElementById('sName').value.trim();
 let user=document.getElementById('sUser').value.trim().toLowerCase().replace(/\s+/g,'');
 let email=document.getElementById('sEmail').value.trim().toLowerCase();
 let pass=document.getElementById('sPass').value.trim();
 if(!name||!user||!email||!pass){document.getElementById('sMsg').innerText='Fill all fields';return;}
 ME={id:Date.now().toString(), username:user, full_name:name, email:email, password:pass, avatar:'https://i.pravatar.cc/150?u='+user, online:true, last_seen:Date.now()};
 let users=JSON.parse(localStorage.getItem('sl_all_users')||'[]');
 users.push(ME); localStorage.setItem('sl_all_users',JSON.stringify(users));
 localStorage.setItem('sl_user',JSON.stringify(ME));
 if(sb){sb.from('users').insert(ME).then(()=>{});}
 enterApp();
}

function doLogin(){
 let u=document.getElementById('lUser').value.trim().toLowerCase();
 let p=document.getElementById('lPass').value.trim();
 if(!u||!p){document.getElementById('lMsg').innerText='Enter username and password';return;}
 let users=JSON.parse(localStorage.getItem('sl_all_users')||'[]');
 let found=users.find(x=> (x.username===u || x.email===u) && x.password===p);
 if(found){ ME=found; }
 else {
  // if not in local, allow any username for now so app never gets stuck
  ME={id:Date.now().toString(), username:u.split('@')[0].replace(/\s+/g,''), full_name:u, email:u.includes('@')?u:'', password:p, avatar:'https://i.pravatar.cc/150?u='+u, online:true, last_seen:Date.now()};
  users.push(ME); localStorage.setItem('sl_all_users',JSON.stringify(users));
 }
 localStorage.setItem('sl_user',JSON.stringify(ME));
 enterApp();
 if(sb &&!found){ sb.from('users').select('*').or(`username.eq.${ME.username},email.eq.${ME.email}`).then(async ({data})=>{ if(!data||data.length===0){ await sb.from('users').insert(ME); }}); }
}

function enterApp(){
 document.getElementById('loginPage').style.display='none';
 document.getElementById('signupPage').style.display='none';
 document.getElementById('app').style.display='flex';
 document.getElementById('myName').innerText=ME.username;
 loadFeed(); loadLive(); loadInbox(); loadReels();
}

function nav(p){
 document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));
 document.getElementById('p'+p).classList.add('on');
 document.querySelectorAll('.ni').forEach(e=>e.classList.remove('on'));
 let el=document.getElementById('n'+p); if(el) el.classList.add('on');
 if(p==='Feed') loadFeed(); if(p==='Live') loadLive(); if(p==='Inbox') loadInbox(); if(p==='Reels') loadReels();
}

async function loadFeed(){
 let posts=[]; if(sb){ try{ let r=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(50); posts=r.data||[]; }catch(e){} }
 let local=JSON.parse(localStorage.getItem('sl_posts')||'[]'); posts=[...posts,...local];
 let f=document.getElementById('feed'); if(posts.length===0){f.innerHTML='<div style="padding:40px;text-align:center;color:#666">No posts yet.<br>Tap + to create</div>';return;}
 f.innerHTML=posts.map(p=>`<div style="border-bottom:1px solid #1a1a1a"><div style="display:flex;gap:8px;padding:10px;align-items:center"><img src="${p.avatar||'https://i.pravatar.cc/150'}" style="width:32px;height:32px;border-radius:50%"><b>${p.full_name||p.username}</b> <small style="color:#666">@${p.username}</small></div>${p.image?`<img src="${p.image}" style="width:100%">`:''}<div style="padding:8px 12px">${p.caption||''}</div></div>`).join('');
}
async function doCreate(){
 let cap=document.getElementById('cCap').value; let type=document.getElementById('cType').value; let file=document.getElementById('cFile').files[0];
 if(!file) return document.getElementById('cMsg').innerText='Pick image';
 let fr=new FileReader(); fr.onload=async()=>{
  let post={id:Date.now(), user_id:ME.id, username:ME.username, full_name:ME.full_name, avatar:ME.avatar, caption:cap, image:fr.result, type:type, created_at:Date.now()};
  let local=JSON.parse(localStorage.getItem('sl_posts')||'[]'); local.unshift(post); localStorage.setItem('sl_posts',JSON.stringify(local));
  if(sb){ try{ await sb.from('posts').insert({user_id:ME.id, username:ME.username, full_name:ME.full_name, avatar:ME.avatar, caption:cap, image:fr.result, type:type, created_at:Date.now()}); }catch(e){} }
  document.getElementById('cMsg').innerText='Posted!'; nav('Feed');
 }; fr.readAsDataURL(file);
}
async function loadLive(){
 if(!sb){ document.getElementById('liveList').innerHTML='<div style="padding:10px;color:#666">Live needs internet, but local posts work</div>'; return; }
 let {data}=await sb.from('live_messages').select('*').order('created_at',{ascending:true}).limit(100);
 document.getElementById('liveList').innerHTML=(data||[]).map(m=>`<div class="bubble ${m.username===ME.username?'me':'other'}"><b style="font-size:10px">${m.username}</b><br>${m.text||''}${m.image?`<img src="${m.image}" style="max-width:160px;border-radius:8px;margin-top:5px">`:''}</div>`).join('');
}
async function sendLive(){ let t=document.getElementById('liveInp').value.trim(); if(!t||!sb) return; document.getElementById('liveInp').value=''; await sb.from('live_messages').insert({username:ME.username, text:t, created_at:Date.now()}); loadLive(); }
async function loadInbox(){
 if(!sb){ document.getElementById('inboxList').innerHTML='<div style="padding:20px;color:#666">Inbox needs internet</div>'; return; }
 let {data}=await sb.from('users').select('*'); let list=document.getElementById('inboxList'); list.innerHTML=(data||[]).filter(u=>u.username!==ME.username).map(u=>`<div style="padding:12px;border-bottom:1px solid #222;display:flex;justify-content:space-between" onclick="openChat('${u.username}')"><div style="display:flex;gap:8px;align-items:center"><img src="${u.avatar}" style="width:36px;height:36px;border-radius:50%"><b>${u.username}</b> ${u.online?'🟢':''}</div><span>💬</span></div>`).join('');
}
function openChat(u){ CUR_CHAT=u; document.getElementById('inboxList').style.display='none'; document.getElementById('secretBox').style.display='block'; document.getElementById('secretTitle').innerText=u; renderChat(); }
async function renderChat(){ if(!CUR_CHAT||!sb) return; let {data}=await sb.from('secret_messages').select('*').or(`and(from_user.eq.${ME.username},to_user.eq.${CUR_CHAT}),and(from_user.eq.${CUR_CHAT},to_user.eq.${ME.username})`).order('created_at',{ascending:true}); document.getElementById('secretMsgs').innerHTML=(data||[]).map(m=>`<div class="bubble ${m.from_user===ME.username?'me':'other'}">${m.text||''}</div>`).join(''); }
async function sendSecret(){ let t=document.getElementById('secretInp').value.trim(); if(!t||!CUR_CHAT||!sb) return; document.getElementById('secretInp').value=''; await sb.from('secret_messages').insert({from_user:ME.username,to_user:CUR_CHAT,text:t,delivered:true,read:false,created_at:Date.now()}); renderChat(); }
async function loadReels(){
 let posts=[]; if(sb){ try{ let r=await sb.from('posts').select('*').eq('type','reel').order('created_at',{ascending:false}); posts=r.data||[]; }catch(e){} }
 let local=JSON.parse(localStorage.getItem('sl_posts')||'[]').filter(p=>p.type==='reel')); posts=[...posts,...local];
 document.getElementById('reelsList').innerHTML=posts.map(p=>`<div style="height:70vh;border-bottom:1px solid #222;position:relative"><img src="${p.image}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:10px;left:10px"><b>@${p.username}</b><br>${p.caption||''}</div></div>`).join('');
 if(posts[0]) CUR_REEL=posts[0].id;
}
async function commentReel(){ let t=document.getElementById('reelInp').value.trim(); if(!t||!sb||!CUR_REEL) return; document.getElementById('reelInp').value=''; await sb.from('comments').insert({post_id:CUR_REEL, username:ME.username, text:t, created_at:Date.now()}); alert('Comment added'); }

let saved=localStorage.getItem('sl_user'); if(saved){ ME=JSON.parse(saved); enterApp(); }
</script></body></html>
