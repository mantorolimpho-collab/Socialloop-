<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOCIALLOOP REAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#080808;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{padding:14px;background:#000;display:flex;justify-content:space-between;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:18px}.logo span{color:#c084fc}
.chat{flex:1;margin:8px 12px;background:#0e0e0e;border-radius:20px;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 14px;border-radius:18px;max-width:82%;font-size:14px;word-break:break-word}
.me{background:#c084fc;color:#000;align-self:flex-end}
.other{background:#3b3bff;color:#fff;align-self:flex-start}
.inputRow{display:flex;gap:8px;padding:12px;background:#000}
.input{flex:1;background:#1a1a1a;border:none;border-radius:24px;padding:13px 18px;color:#fff;outline:none}
.sendBtn{background:#c084fc;border:none;border-radius:24px;padding:12px 22px;font-weight:900;cursor:pointer}
.chips{display:flex;gap:10px;padding:10px 12px}
.chip{flex:1;padding:13px;border-radius:24px;border:none;font-weight:800;cursor:pointer}
.active{outline:2px solid #c084fc}
</style>
</head>
<body>
<div class="header">
<div class="logo">SOCIAL<span>LOOP</span> REAL</div>
<div style="color:#22c55e;font-size:11px">● LIVE</div>
</div>
<div class="chips">
<button class="chip active" id="btnLive" onclick="switchMode('live')" style="background:#c084fc;color:#000">Live Chat</button>
<button class="chip" id="btnSecret" onclick="switchMode('secret')" style="background:#1e1e1e;color:#fff">Secret Inbox</button>
</div>
<div id="status" style="font-size:11px;color:#22c55e;padding:0 14px 4px"></div>
<div class="chat" id="chat"></div>
<div class="inputRow">
<input class="input" id="input" placeholder="Type message..." onkeydown="if(event.key==='Enter')send()">
<button class="sendBtn" onclick="send()">Send</button>
</div>

<script>
const SUPABASE_URL = 'https://ysfjnpyhwogfjkdzruqz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MMVTip9_ZpJOpyilnXPF3w_SnXHgnfL';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let MODE = 'live';
let USERNAME = 'user_' + Math.floor(Math.random()*9000);

function switchMode(m){
 MODE = m;
 document.getElementById('btnLive').className = m==='live'?'chip active':'chip';
 document.getElementById('btnLive').style.background = m==='live'?'#c084fc':'#1e1e1e';
 document.getElementById('btnLive').style.color = m==='live'?'#000':'#fff';
 document.getElementById('btnSecret').className = m==='secret'?'chip active':'chip';
 document.getElementById('btnSecret').style.background = m==='secret'?'#c084fc':'#1e1e1e';
 document.getElementById('btnSecret').style.color = m==='secret'?'#000':'#fff';
 document.getElementById('chat').innerHTML = '';
 loadMessages();
}

function addMessage(row){
 const chat = document.getElementById('chat');
 const div = document.createElement('div');
 div.className = 'msg ' + (row.username===USERNAME?'me':'other');
 div.textContent = '@'+row.username+': '+row.text;
 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
}

async function loadMessages(){
 const {data, error} = await supabaseClient.from('messages').select('*').eq('mode', MODE).order('created_at',{ascending:true}).limit(200);
 if(!error && data){
  document.getElementById('chat').innerHTML='';
  data.forEach(addMessage);
 }
}

async function send(){
 const el = document.getElementById('input');
 const text = el.value.trim();
 if(!text) return;
 el.value='';
 await supabaseClient.from('messages').insert([{text:text, username:USERNAME, mode:MODE}]);
}

async function init(){
 document.getElementById('status').innerText = 'Connected as @'+USERNAME+' | DB: ysfjnpyhwogfjkdzruqz';
 await loadMessages();
 supabaseClient.channel('realtime-messages')
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{
  if(payload.new.mode===MODE) addMessage(payload.new);
 }).subscribe();
}
init();
</script>
</body>
</html>
