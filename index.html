<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialLoop - Permanent Real App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff;height:100dvh;display:flex;flex-direction:column}
.page{display:none;flex-direction:column;flex:1;overflow:auto;max-width:600px;margin:0 auto;width:100%;padding-bottom:130px}.page.on{display:flex}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;max-width:600px;margin:0 auto}
.ni{color:#666;font-size:11px;text-align:center;cursor:pointer}.ni.on{color:#c084fc}
.bar{position:fixed;bottom:56px;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;gap:8px;padding:8px;max-width:600px;margin:0 auto;align-items:center}
.binner{flex:1;display:flex;align-items:center;gap:8px;background:#222;border-radius:24px;padding:6px 12px}
.mi{flex:1;background:transparent;border:none;color:#fff;outline:none}
.tick{font-size:10px}.tick.blue{color:#1e90ff}.tick.grey{color:#888}
</style></head><body>
<div id="loginPage" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">
<h1 style="font-size:42px;font-weight:900">Social<span style="color:#c084fc">Loop</span></h1>
<p style="color:#25D366;margin:8px 0">Real App - Permanent Vision</p>
<input id="emailInput" placeholder="Email" style="width:320px;padding:16px;border-radius:16px;border:none;background:#e8efff;color:#000;margin-top:12px">
<input id="userInput" placeholder="Username" style="width:320px;padding:16px;border-radius:16px;border:none;background:#1a1a1a;color:#fff;margin-top:8px;border:1px solid #333">
<button onclick="enterApp()" style="width:320px;padding:16px;border-radius:28px;border:none;background:#c084fc;font-weight:900;margin-top:12px;color:#000">ENTER</button>
<button onclick="enterApp()" style="width:320px;padding:14px;border-radius:28px;border:1px solid #333;background:#000;color:#fff;margin-top:8px">SIGN UP</button>
</div>

<div id="mainApp" style="display:none;flex-direction:column;flex:1;overflow:hidden">
<div style="padding:12px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;max-width:600px;margin:0 auto;width:100%"><b>Social<span style="color:#c084fc">Loop</span> <small style="color:#25D366">Permanent</small></b><span id="onlineCount" style="font-size:11px;color:#888"></span></div>

<div id="pFeed" class="page on"><div style="padding:10px;display:flex;gap:8px;overflow:auto" id="storyBar"></div><div id="feedList"></div></div>
<div id="pLive" class="page"><div style="padding:10px;font-weight:700;border-bottom:1px solid #111">Live Box 🔴 <small style="color:#25D366">Press your message to delete</small></div><div id="liveList"></div></div>
<div id="pReels" class="page"><div id="reelsList"></div></div>
<div id="pInbox" class="page"><div id="inboxList"></div><div id="chatView" style="display:none;flex-direction:column;flex:1"><div style="padding:10px;border-bottom:1px solid #222;display:flex;justify-content:space-between"><b id="chatName"></b><span onclick="closeChat()" style="color:#c084fc">Back</span></div><div id="chatMsgs" style="flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px"></div></div></div>
<div id="pProfile" class="page" style="padding:20px;text-align:center"><img id="myAvatar" style="width:90px;height:90px;border-radius:50%;border:3px solid #c084fc"><h3 id="myName"></h3><p id="myEmail" style="color:#888;font-size:12px"></p><div style="display:flex;gap:10px;justify-content:center;margin:10px"><button onclick="openCreate('story')" style="background:#c084fc;border:none;padding:8px 14px;border-radius:20px;font-weight:700">+ Add Story</button><button onclick="logout()" style="background:#222;color:#fff;border:none;padding:8px 14px;border-radius:20px">Logout</button></div><div id="myPosts"></div></div>
<div id="pCreate" class="page" style="padding:16px"><h3 id="createTitle">Create Post</h3><div style="display:flex;gap:6px;margin:12px 0"><button class="pill on" id="btnPost" onclick="setType('post')" style="padding:6px 14px;border-radius:20px;border:none;background:#c084fc">Post</button><button id="btnReel" onclick="setType('reel')" style="padding:6px 14px;border-radius:20px;border:none;background:#222;color:#fff">Reels</button><button id="btnStory" onclick="setType('story')" style="padding:6px 14px;border-radius:20px;border:none;background:#222;color:#fff">Story</button></div><input id="capInput" placeholder="Caption..." style="width:100%;padding:14px;border-radius:12px;background:#1a1a1a;border:1px solid #333;color:#fff"><input type="file" id="mediaFile" accept="image/*,video/*" style="margin:12px 0"><div id="preview"></div><p id="upStatus" style="color:#25D366"></p><button onclick="createPost()" style="width:100%;padding:16px;border-radius:28px;background:#c084fc;border:none;font-weight:900">Share Forever (Permanent)</button></div>

<div class="bar" id="bottomBar"><div class="binner"><input id="mainInput" class="mi" placeholder="Message, photo, video..."><input type="file" id="attachFile" accept="image/*,video/*" style="display:none"><label for="attachFile" style="cursor:pointer">📎</label><label for="attachFile" style="cursor:pointer">📷</label></div><button id="sendBtn" style="background:#25D366;border:none;width:42px;height:42px;border-radius:50%">➤</button></div>
<div class="nav"><div class="ni on" onclick="openTab('Feed')">🏠<br>Feed</div><div class="ni" onclick="openTab('Live')">🔴<br>Live</div><div onclick="openTab('Create')" style="background:#c084fc;color:#000;width:38px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900">+</div><div class="ni" onclick="openTab('Reels')">🎬<br>Reels</div><div class="ni" onclick="openTab('Inbox')">📩<br>Inbox</div><div class="ni" onclick="openTab('Profile')">👤<br>Me</div></div>
</div>

<div id="profileModal" style="display:none;position:fixed;inset:0;background:#000;z-index:99;padding:20px;max-width:600px;margin:0 auto;overflow:auto"><div style="display:flex;justify-content:space-between"><b id="viewName"></b><span onclick="document.getElementById('profileModal').style.display='none'" style="color:#c084fc">Close</span></div><img id="viewAvatar" style="width:80px;height:80px;border-radius:50%;margin:10px 0"><div id="viewActions"></div><div id="viewPosts"></div></div>

<script>
const sb=supabase.createClient("https://ysfjnpyhwogfjkdzruqz.supabase.co","sb_publishable_MMVTip9_ZpJOpyilnXPF3w_SnXHgnfL");
let ME=null,TYPE='post',CUR_CHAT=null,PENDING=null,USERS=[];
function enterApp(){let email=document.getElementById('emailInput').value.trim().toLowerCase()||'mantorolimpho@gmail.com';let uname=document.getElementById('userInput').value.trim()||email.split('@')[0];ME={id:Date.now()+'',username:uname,email:email,avatar:'https://i.pravatar.cc/150?u='+email,online:true,last_seen:Date.now()};localStorage.setItem('sl_user',JSON.stringify(ME));startApp();}
let saved=localStorage.getItem('sl_user');if(saved){ME=JSON.parse(saved);startApp();}
function startApp(){document.getElementById('loginPage').style.display='none';document.getElementById('mainApp').style.display='flex';sb.from('users').upsert({...ME,online:true,last_seen:Date.now()}).then(()=>{loadAll();setInterval(()=>sb.from('users').update({online:true,last_seen:Date.now()}).eq('id',ME.id),15000);});}
function logout(){sb.from('users').update({online:false}).eq('id',ME.id).then(()=>{localStorage.clear();location.reload();});}
function openTab(t){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById('p'+t).classList.add('on');document.querySelectorAll('.ni').forEach(n=>n.classList.remove('on'));if(t==='Feed')loadFeed();if(t==='Live')loadLive();if(t==='Reels')loadReels();if(t==='Inbox')loadInbox();if(t==='Profile')loadProfile();}
function setType(t){TYPE=t;document.getElementById('btnPost').style.background=t==='post'?'#c084fc':'#222';document.getElementById('btnReel').style.background=t==='reel'?'#c084fc':'#222';document.getElementById('btnStory').style.background=t==='story'?'#c084fc':'#222';document.getElementById('createTitle').innerText='Create '+t;}
function renderMedia(url){if(!url)return'';if(url.includes('.mp4')||url.includes('video'))return `<video src="${url}" controls style="width:100%;border-radius:12px;margin-top:6px"></video>`;return `<img src="${url}" style="width:100%;border-radius:12px;margin-top:6px">`;}
async function uploadFile(f){if(!f)return'';document.getElementById('upStatus').innerText='Uploading permanent...';let name=Date.now()+'_'+f.name.replace(/[^a-z0-9.]/gi,'');let {error}=await sb.storage.from('media').upload(name,f,{upsert:true});if(error){document.getElementById('upStatus').innerText=error.message;return'';}let {data}=sb.storage.from('media').getPublicUrl(name);document.getElementById('upStatus').innerText='Permanent ✓';return data.publicUrl;}
document.getElementById('mediaFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.getElementById('preview').innerHTML=`<img src="${r.result}" style="width:100%;border-radius:12px">`;document.getElementById('preview')._file=f;};r.readAsDataURL(f);});
async function createPost(){let cap=document.getElementById('capInput').value;let file=document.getElementById('preview')._file;let url='';if(file)url=await uploadFile(file);if(!cap&&!url){alert('Add caption or photo/video');return;}if(TYPE==='story'){await sb.from('stories').insert({username:ME.username,avatar:ME.avatar,image:url||cap,created_at:Date.now()});}else{await sb.from('posts').insert({user_id:ME.id,username:ME.username,avatar:ME.avatar,caption:cap,image:url,type:TYPE,created_at:Date.now()});}document.getElementById('capInput').value='';document.getElementById('preview').innerHTML='';document.getElementById('preview')._file=null;alert('Permanent! Old posts still there');openTab(TYPE==='reel'?'Reels':'Feed');}
async function loadAll(){let {data}=await sb.from('users').select('*');USERS=data||[];document.getElementById('onlineCount').innerText=(USERS.filter(u=>u.online).length)+' online';loadFeed();}
async function loadFeed(){let {data:posts}=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(100);let {data:likes}=await sb.from('likes').select('*');let {data:comments}=await sb.from('comments').select('*');let {data:stories}=await sb.from('stories').select('*').order('created_at',{ascending:false}).limit(20);document.getElementById('storyBar').innerHTML=`<div onclick="openTab('Create')" style="min-width:60px;text-align:center"><div style="width:54px;height:54px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center">+</div><small>Story</small></div>`+(stories||[]).map(s=>`<div onclick="viewProfile('${s.username}')" style="min-width:60px;text-align:center"><img src="${s.avatar}" style="width:54px;height:54px;border-radius:50%;border:2px solid #c084fc"><br><small>${s.username}</small></div>`).join('');document.getElementById('feedList').innerHTML=(posts||[]).filter(p=>p.type!=='reel').map(p=>{let lc=(likes||[]).filter(l=>l.post_id==p.id).length;let liked=(likes||[]).some(l=>l.post_id==p.id&&l.username==ME.username);let cc=(comments||[]).filter(c=>c.post_id==p.id);return `<div style="border-bottom:1px solid #111;padding:12px"><div style="display:flex;gap:8px" onclick="viewProfile('${p.username}')"><img src="${p.avatar}" style="width:34px;height:34px;border-radius:50%"><div><b>${p.username}</b> <small style="color:#25D366">Permanent ✓✓</small><br><small style="color:#888">${new Date(p.created_at).toLocaleString()}</small></div></div>${renderMedia(p.image)}<div style="margin-top:8px">${p.caption||''}</div><div style="display:flex;gap:18px;margin-top:10px"><span onclick="likePost(${p.id})" style="cursor:pointer">${liked?'❤️':'🤍'} ${lc} Like</span><span onclick="document.getElementById('cb${p.id}').style.display='block'" style="cursor:pointer">💬 ${cc.length} Comment</span><span onclick="viewProfile('${p.username}')" style="cursor:pointer">👤 Profile</span></div><div id="cb${p.id}" style="display:none;margin-top:10px;background:#0a0a0a;padding:8px;border-radius:12px"><div>${cc.map(c=>`<div style="padding:4px"><b>${c.username}:</b> ${c.text}</div>`).join('')}</div><div style="display:flex;gap:6px;margin-top:6px"><input id="ci${p.id}" placeholder="Comment..." style="flex:1;background:#222;border:none;padding:10px;border-radius:20px;color:#fff"><button onclick="addComment(${p.id})" style="background:#c084fc;border:none;padding:8px 14px;border-radius:20px">Send</button></div></div></div>`}).join('')||'<div style="padding:30px;text-align:center;color:#666">No posts yet - oldest will stay forever when you add</div>';}
async function likePost(id){let {data}=await sb.from('likes').select('*').eq('post_id',id).eq('username',ME.username);if(data&&data.length>0)await sb.from('likes').delete().eq('post_id',id).eq('username',ME.username);else await sb.from('likes').insert({post_id:id,username:ME.username,created_at:Date.now()});loadFeed();}
async function addComment(pid){let el=document.getElementById('ci'+pid);let t=el.value.trim();if(!t)return;el.value='';await sb.from('comments').insert({post_id:pid,username:ME.username,text:t,created_at:Date.now()});loadFeed();}
async function loadLive(){let {data}=await sb.from('live_messages').select('*').order('created_at',{ascending:true}).limit(100);document.getElementById('liveList').innerHTML=(data||[]).map(m=>{let own=m.username===ME.username;return `<div style="margin:8px;border:2px solid #c084fc;border-radius:16px;padding:8px;position:relative" ${own?`onclick="if(confirm('Delete your message?')) deleteLive(${m.id})"` :''}><b>${m.username}</b> ${own?'<small>(tap to delete/fix)</small>':''}<br>${renderMedia(m.image)}${m.text||''}<br><small class="tick ${own?'blue':'grey'}">${own?'✓✓ read - Permanent':'✓'}</small></div>`}).join('');}
async function deleteLive(id){await sb.from('live_messages').delete().eq('id',id);loadLive();}
async function loadReels(){let {data}=await sb.from('posts').select('*').eq('type','reel').order('created_at',{ascending:false});document.getElementById('reelsList').innerHTML=(data||[]).map(p=>`<div style="height:75vh;position:relative;background:#111;margin-bottom:2px">${renderMedia(p.image)}<div style="position:absolute;bottom:80px;left:12px"><b>@${p.username}</b><br>${p.caption||''}<br><small style="color:#25D366">Permanent</small></div></div>`).join('')||'<div style="padding:30px;color:#666">No reels - add from +</div>';}
async function loadInbox(){let {data:users}=await sb.from('users').select('*');USERS=users||[];document.getElementById('inboxList').style.display='block';document.getElementById('chatView').style.display='none';document.getElementById('inboxList').innerHTML=(users||[]).filter(u=>u.username!==ME.username).map(u=>`<div style="padding:14px;border-bottom:1px solid #111;display:flex;justify-content:space-between" onclick="openChat('${u.username}')"><div><b>${u.username}</b><br><small style="color:${u.online?'#25D366':'#888'}">${u.online?'● Online':'○ Offline'} - Permanent</small></div><span>➤</span></div>`).join('');}
function openChat(u){CUR_CHAT=u;document.getElementById('inboxList').style.display='none';document.getElementById('chatView').style.display='flex';document.getElementById('chatName').innerText=u;loadChat();}
function closeChat(){CUR_CHAT=null;document.getElementById('chatView').style.display='none';document.getElementById('inboxList').style.display='block';loadInbox();}
async function loadChat(){let {data}=await sb.from('secret_messages').select('*').or(`and(from_user.eq.${ME.username},to_user.eq.${CUR_CHAT}),and(from_user.eq.${CUR_CHAT},to_user.eq.${ME.username})`).order('created_at',{ascending:true});document.getElementById('chatMsgs').innerHTML=(data||[]).map(m=>{let me=m.from_user===ME.username;let target=USERS.find(u=>u.username===(me?CUR_CHAT:m.from_user));let tick=me?(target&&target.online?(m.read?'<span class="tick blue">✓✓ read</span>':'<span class="tick grey">✓✓ delivered</span>'):'<span class="tick grey">✓ sent</span>'):'';return `<div style="max-width:78%;padding:10px 14px;border-radius:18px;${me?'background:#c084fc;color:#000;align-self:flex-end':'background:#222;align-self:flex-start'}" ${me?`onclick="if(confirm('Delete this message to fix?')) deleteInbox(${m.id})"` :''}>${renderMedia(m.image)}${m.text||''}<br><small>${new Date(m.created_at).toLocaleTimeString()} ${tick} ${me?'(tap to delete)':''}</small></div>`}).join('');if(data) data.filter(m=>m.to_user===ME.username&&!m.read).forEach(m=>sb.from('secret_messages').update({read:true}).eq('id',m.id));}
async function deleteInbox(id){await sb.from('secret_messages').delete().eq('id',id);loadChat();}
async function loadProfile(){document.getElementById('myAvatar').src=ME.avatar;document.getElementById('myName').innerText=ME.username;document.getElementById('myEmail').innerText=ME.email;let {data}=await sb.from('posts').select('*').eq('username',ME.username).order('created_at',{ascending:false});document.getElementById('myPosts').innerHTML=(data||[]).map(p=>`<div style="padding:10px;border-bottom:1px solid #111">${renderMedia(p.image)}${p.caption||''} <small style="color:#25D366">Permanent - ${new Date(p.created_at).toLocaleDateString()}</small></div>`).join('');}
async function viewProfile(username){let u=USERS.find(x=>x.username===username)||{username:username,avatar:'https://i.pravatar.cc/150?u='+username};document.getElementById('profileModal').style.display='block';document.getElementById('viewName').innerText=u.username;document.getElementById('viewAvatar').src=u.avatar;let {data:f}=await sb.from('follows').select('*').eq('follower',ME.username).eq('following',username);let isF=f&&f.length>0;document.getElementById('viewActions').innerHTML=`<button onclick="toggleFollow('${username}')" style="background:${isF?'#222':'#c084fc'};color:${isF?'#fff':'#000'};border:none;padding:8px 16px;border-radius:20px;margin:8px 0">${isF?'Unfollow':'Follow'}</button> <small style="color:${u.online?'#25D366':'#888'}">${u.online?'● Online':'○ Offline'}</small>`;let {data:posts}=await sb.from('posts').select('*').eq('username',username).order('created_at',{ascending:false});document.getElementById('viewPosts').innerHTML=(posts||[]).map(p=>`<div style="padding:8px;border-bottom:1px solid #111">${renderMedia(p.image)}${p.caption||''} <small>Permanent</small></div>`).join('')||'<div style="color:#666">No posts - oldest will stay</div>';}
async function toggleFollow(username){let {data}=await sb.from('follows').select('*').eq('follower',ME.username).eq('following',username);if(data&&data.length>0)await sb.from('follows').delete().eq('follower',ME.username).eq('following',username);else await sb.from('follows').insert({follower:ME.username,following:username,created_at:Date.now()});viewProfile(username);}
document.getElementById('attachFile').addEventListener('change',e=>{PENDING=e.target.files[0];document.getElementById('mainInput').placeholder='Photo/video ready - tap send ➤';});
document.getElementById('sendBtn').addEventListener('click',async()=>{let text=document.getElementById('mainInput').value.trim();let url='';if(PENDING){url=await uploadFile(PENDING);PENDING=null;}if(!text&&!url)return;let active=document.querySelector('.page.on').id;if(active==='pLive'){await sb.from('live_messages').insert({username:ME.username,text:text,image:url,created_at:Date.now()});loadLive();}else if(active==='pInbox'&&CUR_CHAT){await sb.from('secret_messages').insert({from_user:ME.username,to_user:CUR_CHAT,text:text,image:url,created_at:Date.now(),delivered:true,read:false});loadChat();}else if(active==='pFeed'||active==='pReels'){await sb.from('posts').insert({user_
