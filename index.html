<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>SocialLoop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;height:100dvh;display:flex;flex-direction:column}
.inputL{background:#e8efff;border:none;padding:16px 20px;border-radius:14px;color:#000;width:100%;max-width:360px;margin-top:12px;font-size:15px;outline:none}
.btnL{background:#c084fc;border:none;padding:16px;border-radius:28px;font-weight:900;width:100%;max-width:360px;margin-top:14px;color:#000;cursor:pointer}
.header{padding:14px 16px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center;background:#000;position:sticky;top:0;z-index:10}
.page{display:none;flex:1;overflow-y:auto;max-width:600px;margin:0 auto;width:100%;padding-bottom:90px;flex-direction:column}.page.on{display:flex}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;padding:8px 0 12px;max-width:600px;margin:0 auto;width:100%;z-index:20}
.ni{color:#555;font-size:10px;text-align:center;cursor:pointer;line-height:12px}.ni.on{color:#c084fc}
.plus{background:#c084fc;color:#000;width:36px;height:28px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;cursor:pointer}
.liveCard{border:3px solid #c084fc;border-radius:18px;padding:6px;margin:12px;background:#0a0a0a;position:relative}
.liveCard img,.liveCard video{width:100%;border-radius:12px;display:block}
.dot{width:10px;height:10px;border-radius:50%;background:#333;display:inline-block}.dot.on{background:#25D366;box-shadow:0 0 6px #25D366}
/* YOUR GREEN CIRCLED BAR - EXACTLY LIKE SCREENSHOT */
.msgBar{display:flex;gap:8px;padding:8px 10px;background:#1a1a1a;border-top:1px solid #222;align-items:center;position:sticky;bottom:0;width:100%;z-index:30}
.msgBarInner{flex:1;display:flex;align-items:center;background:#2a2a2a;border-radius:28px;padding:6px 14px;gap:10px}
.msgInp{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:15px;padding:8px 0}
.iconBtn{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer}
.micBtn{background:#25D366;border:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#000;cursor:pointer}
.bubble{padding:10px 14px;border-radius:18px;max-width:78%;font-size:13px;word-break:break-word}.me{background:#c084fc;color:#000;align-self:flex-end}.other{background:#222;align-self:flex-start}
.pill{padding:6px 14px;border-radius:18px;border:none;font-size:12px;cursor:pointer}.pill.on{background:#c084fc;color:#000;font-weight:700}.pill.off{background:#222;color:#fff}
/* PROFILE MODAL */
#profileModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:99;flex-direction:column;overflow:auto}
</style></head><body>

<div id="login" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">
<h1 style="font-size:36px;font-weight:900">Social<span style="color:#c084fc">Loop</span></h1>
<input id="loginInput" class="inputL" placeholder="mantorolimpho@gmail.com" value="mantorolimpho@gmail.com">
<button class="btnL" type="button" onclick="doLogin()">Enter</button>
</div>

<div id="app" style="display:none;flex:1;flex-direction:column;overflow:hidden">
<div class="header"><div style="font-weight:900;font-size:18px">Social<span style="color:#c084fc">Loop</span></div><div style="font-size:12px;color:#888" id="topEmail"></div></div>

<div id="pFeed" class="page on"><div id="feed"></div></div>
<div id="pLive" class="page"><div style="padding:14px 16px;font-weight:700;border-bottom:1px solid #111">Live Box <span class="dot on"></span></div><div id="liveList" style="flex:1;overflow-y:auto"></div>
<div class="msgBar"><div class="msgBarInner"><button class="iconBtn" onclick="addEmoji('liveInp')">😊</button><input id="liveInp" class="msgInp" placeholder="Message"><label class="iconBtn" for="liveFile">📎</label><label class="iconBtn" for="liveFile">📷</label><input type="file" id="liveFile" accept="image/*,video/*" style="display:none" onchange="sendLiveFile(event)"></div><button class="micBtn" onclick="sendLive()">🎤</button></div>
</div>

<div id="pReels" class="page"><div id="reelsList" style="flex:1"></div>
<div class="msgBar"><div class="msgBarInner"><button class="iconBtn" onclick="addEmoji('reelInp')">😊</button><input id="reelInp" class="msgInp" placeholder="Message"><label class="iconBtn" for="reelFile">📎</label><label class="iconBtn" for="reelFile">📷</label><input type="file" id="reelFile" accept="image/*,video/*" style="display:none" onchange="sendReelFile(event)"></div><button class="micBtn" onclick="commentReel()">🎤</button></div>
</div>

<div id="pStatus" class="page"><div style="display:flex;gap:16px;padding:16px;align-items:center;border-bottom:1px solid #111"><div onclick="nav('Create')" style="width:58px;height:58px;border-radius:50%;background:#1a1a1a;border:1px dashed #444;display:flex;align-items:center;justify-content:center;font-size:22px;color:#777;cursor:pointer">+</div><div style="text-align:center"><img id="myAvatar" class="avatar" style="border:2px solid #c084fc" onclick="viewProfile(ME.username)"><div style="font-size:11px;margin-top:4px" id="myEmail2"></div></div></div><div style="padding:16px"><b>Status</b><br><small style="color:#666">Disappears after 24 hours</small><div id="statusList" style="margin-top:12px;display:flex;gap:10px;overflow-x:auto"></div></div></div>

<div id="pInbox" class="page"><div style="padding:14px 16px;font-weight:700;border-bottom:1px solid #111;display:flex;justify-content:space-between"><span>Inbox</span><span id="backBtn" style="display:none;color:#c084fc;cursor:pointer" onclick="closeChat()">Back</span></div><div id="inboxList" style="flex:1;overflow-y:auto"></div><div id="secretBox" style="display:none;flex:1;flex-direction:column;overflow:hidden"><div id="secretName" style="padding:10px;font-weight:700;border-bottom:1px solid #222"></div><div id="secretMsgs" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px"></div>
<div class="msgBar"><div class="msgBarInner"><button class="iconBtn" onclick="addEmoji('secretInp')">😊</button><input id="secretInp" class="msgInp" placeholder="Message"><label class="iconBtn" for="secretFile">📎</label><label class="iconBtn" for="secretFile">📷</label><input type="file" id="secretFile" accept="image/*,video/*" style="display:none" onchange="sendSecretFile(event)"></div><button class="micBtn" onclick="sendSecret()">🎤</button></div>
</div></div>

<div id="pCreate" class="page" style="padding:16px"><h2 style="margin-bottom:12px">Create</h2><div style="display:flex;gap:8px;margin-bottom:12px"><button class="pill on" id="bPost" onclick="setM('post')">Post</button><button class="pill off" id="bReel" onclick="setM('reel')">Reels</button><button class="pill off" id="bStatus" onclick="setM('status')">Status</button></div><input id="cCap" class="inputL" placeholder="Caption..." style="max-width:100%;background:#1a1a1a;color:#fff;border:1px solid #333"><div class="msgBar" style="position:static;margin:12px 0;border-radius:28px;border:1px solid #333"><div class="msgBarInner"><button class="iconBtn">😊</button><span style="color:#666;font-size:13px">Choose photo/video</span><label class="iconBtn" for="cFile" style="margin-left:auto">📎</label><label class="iconBtn" for="cFile">📷</label></div></div><input type="file" id="cFile" accept="image/*,video/*" style="display:none"><button class="btnL" style="max-width:100%" onclick="doCreate()">Share Now</button><p id="cMsg" style="color:#c084fc;margin-top:10px"></p><div id="cPreview" style="margin-top:10px"></div></div>

<div class="nav"><div class="ni on" id="nFeed" onclick="nav('Feed')">🏠<br>Feed</div><div class="ni" id="nLive" onclick="nav('Live')">🔴<br>Live Box</div><div class="ni" onclick="nav('Create')"><div class="plus">+</div></div><div class="ni" id="nReels" onclick="nav('Reels')">🎬<br>Reels</div><div class="ni" id="nStatus" onclick="nav('Status')">⭕<br>Status</div><div class="ni" id="nInbox" onclick="nav('Inbox')">📩<br>Inbox</div></div>
</div>

<!-- VIEW PROFILE MODAL -->
<div id="profileModal"><div style="padding:14px;border-bottom:1px solid #222;display:flex;justify-content:space-between"><b id="profName"></b><span onclick="document.getElementById('profileModal').style.display='none'" style="cursor:pointer;color:#c084fc">Close X</span></div><div style="padding:20px;text-align:center"><img id="profAvatar" style="width:90px;height:90px;border-radius:50%;border:3px solid #c084fc"><div id="profEmail" style="margin-top:10px;color:#888"></div><div id="profOnline" style="margin-top:4px"></div></div><div id="profPosts" style="padding:10px"></div></div>

<script>
const SUPA_URL="https://ysfjnpyhwogfjkdzruqz.supabase.co";const SUPA_KEY="sb_publishable_MMVTip9_ZpJOpyilnXPF3w_SnXHgnfL";let sb=null;try{sb=supabase.createClient(SUPA_URL,SUPA_KEY);}catch(e){}
let ME=null,MODE='post',CUR=null,CUR_REEL=null;
function doLogin(){
 let q=document.getElementById('loginInput').value.trim().toLowerCase()||'mantorolimpho@gmail.com';
 ME={id:Date.now().toString(),username:q.split('@')[0].replace(/\s+/g,''),email:q,full_name:q,avatar:'https://i.pravatar.cc/150?u='+q,online:true,last_seen:Date.now()};
 localStorage.setItem('sl_user',JSON.stringify(ME));
 document.getElementById('login').style.display='none';
 document.getElementById('app').style.display='flex';
 document.getElementById('topEmail').innerText=q;
 document.getElementById('myEmail2').innerText=q;
 document.getElementById('myAvatar').src=ME.avatar;
 init();
 if(sb){try{sb.from('users').upsert(ME).then(()=>{}).catch(()=>{});}catch(e){}}
}
function addEmoji(id){ let inp=document.getElementById(id); inp.value+='😊'; inp.focus(); }
function setM(m){MODE=m;document.getElementById('bPost').className=m==='post'?'pill on':'pill off';document.getElementById('bReel').className=m==='reel'?'pill on':'pill off';document.getElementById('bStatus').className=m==='status'?'pill on':'pill off';}
function nav(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));document.getElementById('p'+p).classList.add('on');document.querySelectorAll('.ni').forEach(e=>e.classList.remove('on'));let el=document.getElementById('n'+p);if(el)el.classList.add('on');if(p==='Feed')loadFeed();if(p==='Live')loadLive();if(p==='Reels')loadReels();if(p==='Status')loadStatus();if(p==='Inbox')loadInbox();}
function renderMedia(url){ if(!url) return ''; if(url.startsWith('data:video')||url.includes('.mp4')) return `<video src="${url}" controls style="width:100%;border-radius:12px"></video>`; return `<img src="${url}" style="width:100%;border-radius:12px">`; }

async function viewProfile(username){
 if(!sb) return; let {data:u}=await sb.from('users').select('*').eq('username',username).single(); if(!u) u=ME;
 document.getElementById('profName').innerText='@'+u.username;
 document.getElementById('profAvatar').src=u.avatar;
 document.getElementById('profEmail').innerText=u.email||u.username;
 let isOnline=Date.now()-u.last_seen<120000;
 document.getElementById('profOnline').innerHTML=`<span class="dot ${isOnline?'on':''}"></span> ${isOnline?'<span style="color:#25D366">Online</span>':'Offline'}`;
 let {data:posts}=await sb.from('posts').select('*').eq('username',username).order('created_at',{ascending:false});
 document.getElementById('profPosts').innerHTML=(posts||[]).map(p=>`<div style="border-bottom:1px solid #111;padding:8px">${renderMedia(p.image)}<div style="padding:6px">${p.caption||''}</div></div>`).join('')||'<div style="color:#555;text-align:center">No posts</div>';
 document.getElementById('profileModal').style.display='flex';
}

async function loadFeed(){if(!sb)return;let {data:posts}=await sb.from('posts').select('*').eq('type','post').order('created_at',{ascending:false}).limit(50);let {data:likes}=await sb.from('likes').select('*');let {data:comments}=await sb.from('comments').select('*');let {data:blocks}=await sb.from('blocks').select('*').eq('blocker',ME.username);let {data:users}=await sb.from('users').select('*');let blocked=(blocks||[]).map(b=>b.blocked);let f=document.getElementById('feed');if(!posts||posts.length===0){f.innerHTML='<div style="padding:40px;text-align:center;color:#666">No posts yet<br>Tap + to create first post</div>';return;}f.innerHTML=posts.filter(p=>!blocked.includes(p.username)).map(p=>{let u=users?.find(x=>x.username===p.username);let isOnline=u&&(Date.now()-u.last_seen<120000);let lc=(likes||[]).filter(l=>l.post_id===p.id).length;let isLiked=(likes||[]).some(l=>l.post_id===p.id&&l.username===ME.username);let cc=(comments||[]).filter(c=>c.post_id===p.id);return `<div style="border-bottom:1px solid #111"><div style="display:flex;gap:8px;padding:10px;align-items:center"><img src="${p.avatar}" style="width:32px;height:32px;border-radius:50%;cursor:pointer" onclick="viewProfile('${p.username}')"><div style="flex:1;cursor:pointer" onclick="viewProfile('${p.username}')"><b>${p.username}</b> <span class="dot ${isOnline?'on':''}"></span></div><div style="display:flex;gap:4px"><button onclick="reportPost(${p.id},'${p.username}')" style="background:#1a1a1a;color:#888;border:none;padding:4px 6px;border-radius:8px;font-size:9px">Report</button><button onclick="blockUser('${p.username}')" style="background:#1a1a1a;color:#888;border:none;padding:4px 6px;border-radius:8px;font-size:9px">Block</button>${p.username===ME.username?`<button onclick="deletePost(${p.id})" style="background:#300;color:#f88;border:none;padding:4px 6px;border-radius:8px;font-size:9px">Delete</button>`:''}</div></div>${p.image?renderMedia(p.image):''}<div style="padding:8px 12px">${p.caption||''}</div><div style="display:flex;gap:16px;padding:8px 12px;border-top:1px solid #111"><span onclick="likePost(${p.id})" style="cursor:pointer">${isLiked?'❤️':'🤍'} ${lc}</span><span onclick="document.getElementById('cbox${p.id}').style.display=document.getElementById('cbox${p.id}').style.display==='flex'?'none':'flex'" style="cursor:pointer">💬 ${cc.length}</span></div><div id="cbox${p.id}" style="display:none;padding:8px;gap:6px;flex-direction:column"><div>${cc.map(c=>`<div style="font-size:12px;padding:3px 0"><b style="cursor:pointer" onclick="viewProfile('${c.username}')">${c.username}:</b> ${c.image?renderMedia(c.image):''} ${c.text} ${c.username===ME.username?`<span onclick="deleteComment(${c.id})" style="color:#f55;cursor:pointer"> x</span>`:''}</div>`).join('')}</div><div class="msgBar" style="position:static;border-radius:22px"><div class="msgBarInner"><input id="cinp${p.id}" style="flex:1;background:transparent;border:none;color:#fff;outline:none" placeholder="Message"><label for="cfile${p.id}" style="color:#aaa">📎</label><input type="file" id="cfile${p.id}" accept="image/*,video/*" style="display:none" onchange="addCommentFile(${p.id},event)"></div><button class="micBtn" style="width:36px;height:36px" onclick="addComment(${p.id})">🎤</button></div></div></div>`}).join('');}
async function likePost(id){let {data}=await sb.from('likes').select('*').eq('post_id',id).eq('username',ME.username);if(data&&data.length>0)await sb.from('likes').delete().eq('post_id',id).eq('username',ME.username);else await sb.from('likes').insert({post_id:id,username:ME.username,created_at:Date.now()});loadFeed();}
async function addComment(pid){let t=document.getElementById('cinp'+pid).value.trim();let inp=document.getElementById('cinp'+pid);let fileData=inp.getAttribute('data-file')||'';if(!t&&!fileData)return;inp.value='';inp.removeAttribute('data-file');await sb.from('comments').insert({post_id:pid,username:ME.username,text:t,image:fileData,created_at:Date.now()});loadFeed();}
function addCommentFile(pid,ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{document.getElementById('cinp'+pid).setAttribute('data-file',r.result);document.getElementById('cinp'+pid).placeholder='Photo ready, tap mic to send';};r.readAsDataURL(f);}
async function deleteComment(id){if(!confirm('Delete?'))return;await sb.from('comments').delete().eq('id',id);loadFeed();}
async function deletePost(id){if(!confirm('Delete?'))return;await sb.from('posts').delete().eq('id',id);loadFeed();loadReels();loadStatus();}
async function blockUser(u){if(!confirm('Block '+u+'?'))return;await sb.from('blocks').insert({blocker:ME.username,blocked:u});loadFeed();}
async function reportPost(id,u){let r=prompt('Reason?');if(!r)return;await sb.from('reports').insert({post_id:id,reporter:ME.username,reported_user:u,reason:r,created_at:Date.now()});alert('Reported');}

async function loadLive(){if(!sb)return;let {data}=await sb.from('live_messages').select('*').order('created_at',{ascending:true}).limit(80);document.getElementById('liveList').innerHTML=(data||[]).map(m=>`<div class="liveCard"><div style="font-size:11px;color:#aaa;cursor:pointer" onclick="viewProfile('${m.username}')">${m.username} <span class="dot on"></span></div>${m.username===ME.username?`<button onclick="deleteLive(${m.id})" style="position:absolute;top:6px;right:6px;background:#300;color:#f88;border:none;padding:2px 6px;border-radius:6px;font-size:9px">X</button>`:''}${m.image?renderMedia(m.image):''}<div style="padding:6px 0">${m.text||''}</div><div style="font-size:10px;color:#666">✓✓ delivered</div></div>`).join('');let el=document.getElementById('liveList');el.scrollTop=el.scrollHeight;}
async function deleteLive(id){if(!confirm('Delete?'))return;await sb.from('live_messages').delete().eq('id',id);loadLive();}
async function sendLive(){let t=document.getElementById('liveInp').value.trim();let f=document.getElementById('liveInp').getAttribute('data-file')||'';if(!t&&!f)return;document.getElementById('liveInp').value='';document.getElementById('liveInp').removeAttribute('data-file');await sb.from('live_messages').insert({username:ME.username,text:t,image:f,created_at:Date.now()});loadLive();}
function sendLiveFile(ev){let file=ev.target.files[0];if(!file)return;let fr=new FileReader();fr.onload=()=>{document.getElementById('liveInp').setAttribute('data-file',fr.result);document.getElementById('liveInp').placeholder='Photo/video ready, tap 🎤';};fr.readAsDataURL(file);}

async function loadReels(){if(!sb)return;let {data}=await sb.from('posts').select('*').eq('type','reel').order('created_at',{ascending:false});if(!data||data.length===0){document.getElementById('reelsList').innerHTML='<div style="padding:40px;text-align:center;color:#666">No Reels yet<br>Tap + Reels → video</div>';return;}document.getElementById('reelsList').innerHTML=data.map(p=>{CUR_REEL=p.id;return `<div style="height:70vh;border-bottom:1px solid #111;position:relative"><div style="height:100%">${renderMedia(p.image)}</div><div style="position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between"><div style="cursor:pointer" onclick="viewProfile('${p.username}')"><b>@${p.username}</b> <span class="dot on"></span><br>${p.caption||''}</div><div>${p.username===ME.username?`<button onclick="deletePost(${p.id})" style="background:#300;color:#fff;border:none;padding:6px 10px;border-radius:12px">Delete</button>`:''}</div></div></div>`}).join('');}
async function commentReel(){let t=document.getElementById('reelInp').value.trim();let f=document.getElementById('reelInp').getAttribute('data-file')||'';if(!t&&!f)return;if(!CUR_REEL)return;document.getElementById('reelInp').value='';document.getElementById('reelInp').removeAttribute('data-file');await sb.from('comments').insert({post_id:CUR_REEL,username:ME.username,text:t,image:f,created_at:Date.now()});alert('Comment added');}
function se
