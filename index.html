<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixed Enter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#000;color:#fff;font-family:system-ui;margin:0}.in{width:320px;padding:16px;border-radius:16px;border:none;margin-top:10px}.bt{width:320px;padding:16px;border-radius:28px;border:none;font-weight:900;margin-top:10px;background:#c084fc;color:#000}</style></head><body>
<div id="login" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center"><h1>Social<span style="color:#c084fc">Loop</span></h1><input id="e" class="in" style="background:#e8efff;color:#000" value="mantorolimpho@gmail.com"><input id="u" class="in" style="background:#222;color:#fff;border:1px solid #333" value="ausydee"><button class="bt" id="enterBtn">ENTER - FIXED</button><p style="color:#25D366;font-size:12px">Tap ENTER now works</p></div>
<div id="app" style="display:none"><div style="padding:12px;border-bottom:1px solid #222"><b>SocialLoop Permanent ✓</b> - <span id="who"></span></div><div id="feed" style="max-width:600px;margin:0 auto;padding:20px">Loading permanent posts...</div><button onclick="localStorage.clear();location.reload()" style="margin:20px;background:#222;color:#fff;border:none;padding:8px 16px;border-radius:20px">Logout</button></div>
<script>
const sb=supabase.createClient("https://ysfjnpyhwogfjkdzruqz.supabase.co","sb_publishable_MMVTip9_ZpJOpyilnXPF3w_SnXHgnfL");
let ME=null;
function go(){let email=document.getElementById('e').value.trim()||'mantorolimpho@gmail.com';let uname=document.getElementById('u').value.trim()||'ausydee';ME={id:Date.now()+'',username:uname,email:email,avatar:'https://i.pravatar.cc/150?u='+email,online:true,last_seen:Date.now()};localStorage.setItem('sl_user',JSON.stringify(ME));document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('who').innerText=uname+' Permanent';try{sb.from('users').upsert(ME).then(()=>load()).catch(()=>load());}catch(e){load();}}
document.getElementById('enterBtn').addEventListener('click',go);
let s=localStorage.getItem('sl_user');if(s){ME=JSON.parse(s);document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('who').innerText=ME.username+' Permanent';}
async function load(){try{let {data}=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(20);document.getElementById('feed').innerHTML=(data||[]).map(p=>`<div style="border:1px solid #222;padding:10px;border-radius:12px;margin:10px 0"><b>${p.username}</b> Permanent<br>${p.caption||''}<br>${p.image?`<img src="${p.image}" style="width:100%;border-radius:12px">`:''}</div>`).join('')||'No posts yet - your posts will be permanent forever';}catch(e){document.getElementById('feed').innerHTML='Offline mode - posts saved locally will sync when online. Permanent vision active.';}}
</script></body></html>
