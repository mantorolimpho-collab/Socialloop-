<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialLoop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.inputL{background:#111;border:1px solid #2a2a2a;padding:14px 18px;border-radius:14px;color:#fff;width:100%;max-width:360px;margin-top:12px;font-size:16px;outline:none}
.btnL{background:#c084fc;border:none;padding:16px;border-radius:24px;font-weight:900;width:100%;max-width:360px;margin-top:14px;color:#000;font-size:16px;cursor:pointer}
.tab{display:flex;gap:20px;margin:14px 0}.tab div{padding:8px 14px;border-bottom:2px solid transparent;color:#666;cursor:pointer;font-weight:600}.tab div.on{color:#fff;border-color:#c084fc}
.header{position:sticky;top:0;background:#000;padding:12px 16px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;z-index:10}
.page{display:none;max-width:600px;margin:0 auto;width:100%;padding-bottom:95px}.page.active{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 12px;max-width:600px;margin:0 auto;width:100%;z-index:20}.ni{color:#666;font-size:11px;text-align:center;cursor:pointer}.ni.on{color:#c084fc}
.chatArea{height:calc(100vh - 230px);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#0a0a0a}
.bubble{padding:10px 14px;border-radius:18px;max-width:78%;font-size:14px;word-break:break-word}.me{background:#c084fc;color:#000;align-self:flex-end}.other{background:#222;align-self:flex-start}.bubble img{max-width:200px;border-radius:12px;margin-top:6px;display:block}
.row{display:flex;gap:8px;padding:10px;background:#111;border-top:1px solid #222;align-items:center;position:fixed;bottom:62px;left:0;right:0;max-width:600px;margin:0 auto;width:100%;z-index:30}.inp{flex:1;background:#1e1e1e;border:1px solid #333;border-radius:22px;padding:14px 16px;color:#fff;font-size:16px;outline:none}.snd{background:#c084fc;border:none;border-radius:22px;padding:12px 18px;font-weight:800;color:#000;cursor:pointer}
.post{background:#0c0c0c;border-bottom:1px solid #1f1f1f}.pHead{display:flex;gap:10px;padding:12px;align-items:center}.pHead img{width:34px;height:34px;border-radius:50%}
</style></head><body>
<div id="login">
<h1 style="font-size:42px;font-weight:900">Social<span style="color:#c084fc">Loop</span></h1>
<div class="tab"><div id="tLogin" class="on" onclick="switchTab('login')">Log In</div><div id="tSignup" onclick="switchTab('signup')">Sign Up</div></div>
<div id="loginForm" style="width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center">
<input id="loginInput" class="inputL" placeholder="Username / Email / Phone" autocomplete="off">
<button type="button" class="btnL" onclick="doLogin()">Enter</button>
</div>
<div id="signupForm" style="width:100%;max-width:360px;display:none;flex-direction:column;align-items:center">
<input id="su_fullname" class="inputL" placeholder="Full Name e.g Limpho Mantoro">
<input id="su_username" class="inputL" placeholder="Username e.g ausydee">
<input id="su_email" class="inputL" placeholder="Email">
<input id="su_phone" class="inputL" placeholder="Phone">
<button type="button" class="btnL" onclick="doSignup()">Create Account</button>
</div><div id="msg" style="color:#ff8fab;margin-top:12px;text-align:center"></div>
</div>

<div id="app" style="display:none">
<div class="header"><div style="font-weight:900;font-size:20px">Social<span style="color:#c084fc">Loop</span></div><div id="myName" style="color:#888;font-size:12px;cursor:pointer" onclick="nav('Profile')"></div></div>

<div id="pageFeed" class="page active"><div id="feed"></div><div id="noFeed" style="text-align:center;padding:60px;color:#666">No posts yet<br>Tap + to create first post</div></div>

<div id="pageLiveBox" class="page"><div style="padding:12px;font-weight:800;border-bottom:1px solid #222">Live Box</div><div id="liveMsgs" class="chatArea"></div><div class="row"><input id="liveInp" class="inp" placeholder="Message everyone..."><label for="liveImg" style="font-size:24px;cursor:pointer">📷</label><input type="file" id="liveImg" accept="image/*" style="display:none" onchange="sendLiveImg(event)"><button class="snd" onclick="sendLive()">Send</button></div></div>

<div id="pageInbox" class="page"><div style="padding:12px;font-weight:800;border-bottom:1px solid #222;display:flex;justify-content:space-between"><span>Inbox</span><span id="backInbox" style="display:none;color:#c084fc" onclick="closeSecret()">Back</span></div><div id="inboxList"></div><div id="secretBox" style="display:none"><div id="secretName" style="padding:10px;font-weight:700;border-bottom:1px solid #222;background:#0a0a0a"></div><div id="secretMsgs" class="chatArea" style="height:calc(100vh - 270px)"></div><div class="row"><input id="secretInp" class="inp" placeholder="Type a message..."><label for="secretImg" style="font-size:24px;cursor:pointer">📷</label><input type="file" id="secretImg" accept="image/*" style="display:none" onchange="sendSecretImg(event)"><button class="snd" onclick="sendSecret()">Send</button></div></div></div>

<div id="pageReels" class="page"><div id="reelsList"></div><div id="noReels" style="text-align:center;padding:60px;color:#666">No Reels yet<br>Tap + → Reels → post video</div></div>

<div id="pageStatus" class="page"><div id="statusBar" style="display:flex;gap:12px;padding:12px;overflow-x:auto;border-bottom:1px solid #1a1a1a;background:#0a0a0a"></div><div id="statusView" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;flex-direction:column"><div style="padding:12px;display:flex;justify-content:space-between"><span id="statusOwner"></span><span onclick="closeStatus()" style="color:#c084fc;padding:8px">X Close</span></div><div style="flex:1;display:flex;align-items:center;justify-content:center"><img id="statusImg" style="max-width:100%;max-height:80vh"></div><div id="statusCap" style="padding:16px;text-align:center"></div></div><div style="padding:16px"><h3>Status</h3><p style="color:#666;font-size:12px;margin-top:4px">Disappears after 24 hours</p><div id="myStatuses" style="margin-top:12px"></div></div></div>

<div id="pageCreate" class="page" style="padding:16px"><h2>Create</h2><div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap"><button onclick="setMode('post')" id="bmPost" style="background:#c084fc;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:700">Post</button><button onclick="setMode('reel')" id="bmReel" style="background:#222;color:#fff;border:none;padding:8px 14px;border-radius:20px">Reels</button><button onclick="setMode('status')" id="bmStatus" style="background:#222;color:#fff;border:none;padding:8px 14px;border-radius:20px">Status</button></div><input id="capInp" class="inputL" placeholder="Caption..." style="max-width:100%"><input type="file" id="fileInp" accept="image/*,video/*" style="margin:14px 0"><button class="btnL" style="max-width:100%" onclick="doCreate()">Share Now</button><p id="createMsg" style="color:#c084fc;margin-top:10px"></p></div>

<div id="pageProfile" class="page" style="padding:20px;text-align:center"><div id="profileBox"></div></div>

<div class="nav">
<div class="ni on" id="nFeed" onclick="nav('Feed')">🏠<br>Feed</div>
<div class="ni" id="nLiveBox" onclick="nav('LiveBox')">🔴<br>Live Box</div>
<div class="ni"><div style="background:#c084fc;color:#000;width:44px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px" onclick="nav('Create')">+</div></div>
<div class="ni" id="nReels" onclick="nav('Reels')">🎬<br>Reels</div>
<div class="ni" id="nStatus" onclick="nav('Status')">⭕<br>Status</div>
<div class="ni" id="nInbox" onclick="nav('Inbox')">📩<br>Inbox</div>
</div>
</div>

<script>
let ME=null;let POSTS=JSON.parse(localStorage.getItem('sl_posts')||'[]');let LIVE=JSON.parse(localStorage.getItem('sl_live')||'[]');let SECRET=JSON.parse(localStorage.getItem('sl_secret')||'{}');let STATUS=JSON.parse(localStorage.getItem('sl_status')||'[]');let CUR=null;let MODE='post';
function switchTab(t){document.getElementById('loginForm').style.display=t==='login'?'flex':'none';document.getElementById('signupForm').style.display=t==='signup'?'flex':'none';document.getElementById('tLogin').className=t==='login'?'on':'';document.getElementById('tSignup').className=t==='signup'?'on':'';}
function doSignup(){let fn=document.getElementById('su_fullname').value.trim();let un=document.getElementById('su_username').value.trim().toLowerCase();let em=document.getElementById('su_email').value.trim();let ph=document.getElementById('su_phone').value.trim();if(!un||!em){document.getElementById('msg').innerText='Username + Email needed';return;}if(un.includes(' ')){document.getElementById('msg').innerText='Username no space. Full Name CAN have space';return;}ME={id:Date.now().toString(),username:un,full_name:fn,email:em.toLowerCase(),phone:ph,avatar:'https://i.pravatar.cc/150?u='+un};saveUser();enter();}
function doLogin(){
 let q=document.getElementById('loginInput').value.trim(); if(!q){document.getElementById('msg').innerText='Type your email or username';return;}
 let ql=q.toLowerCase();
 let all=JSON.parse(localStorage.getItem('sl_all_users')||'[]');
 let f=all.find(u=>u.username===ql||u.email===ql||u.phone===ql||(u.full_name&&u.full_name.toLowerCase()===ql));
 if(f){ME=f;localStorage.setItem('sl_user',JSON.stringify(ME));enter();return;}
 // AUTO-CREATE if not found - so Enter ALWAYS works
 ME={id:Date.now().toString(),username:ql.split('@')[0].replace(/\s+/g,''),full_name:q.includes('@')?'Limpho Mantoro':q,email:q.includes('@')?ql:'',phone:q.startsWith('+')?q:'',avatar:'https://i.pravatar.cc/150?u='+ql};
 saveUser(); enter();
}
function saveUser(){localStorage.setItem('sl_user',JSON.stringify(ME));let all=JSON.parse(localStorage.getItem('sl_all_users')||'[]');all=all.filter(u=>u.username!==ME.username);all.push(ME);localStorage.setItem('sl_all_users',JSON.stringify(all));}
function enter(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();}
function nav(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('page'+p).classList.add('active');document.querySelectorAll('.ni').forEach(e=>e.classList.remove('on'));let el=document.getElementById('n'+p);if(el)el.classList.add('on');if(p==='Feed')loadFeed();if(p==='LiveBox')loadLive();if(p==='Inbox')loadInboxList();if(p==='Reels')loadReels();if(p==='Status')loadStatus();if(p==='Profile')loadProfile();}
function setMode(m){MODE=m;['post','reel','status'].forEach(x=>{let b=document.getElementById('bm'+x.charAt(0).toUpperCase()+x.slice(1));b.style.background=x===m?'#c084fc':'#222';b.style.color=x===m?'#000':'#fff';});}
function loadFeed(){let f=document.getElementById('feed');f.innerHTML='';let posts=POSTS.filter(p=>p.type==='post').reverse();if(posts.length===0){document.getElementById('noFeed').style.display='block';return;}document.getElementById('noFeed').style.display='none';posts.forEach(p=>{f.innerHTML+=`<div class="post"><div class="pHead"><img src="${p.avatar}"><div><b>${p.full_name||p.username}</b><br><small style="color:#888">@${p.username}</small></div></div>${p.img?`<div><img src="${p.img}" style="width:100%"></div>`:''}<div style="padding:10px">${p.cap||''}</div></div>`;});}
function loadLive(){let c=document.getElementById('liveMsgs');c.innerHTML='';if(LIVE.length===0)c.innerHTML='<div style="text-align:center;color:#666;padding:20px">No messages yet. Be first!</div>';else LIVE.slice(-100).forEach(m=>{let d=document.createElement('div');d.className='bubble '+(m.from===ME.username?'me':'other');d.innerHTML=`<b style="font-size:11px">${m.from}</b><br>${m.text}${m.img?`<img src="${m.img}">`:''}`;c.appendChild(d);});c.scrollTop=c.scrollHeight;}
function sendLive(){let e=document.getElementById('liveInp'),t=e.value.trim();if(!t)return;e.value='';LIVE.push({from:ME.username,text:t,time:Date.now()});localStorage.setItem('sl_live',JSON.stringify(LIVE));loadLive();}
function sendLiveImg(ev){let file=ev.target.files[0];if(!file)return;let fr=new FileReader();fr.onload=()=>{LIVE.push({from:ME.username,text:'',img:fr.result,time:Date.now()});localStorage.setItem('sl_live',JSON.stringify(LIVE));loadLive();};fr.readAsDataURL(file);}
function loadInboxList(){let all=JSON.parse(localStorage.getItem('sl_all_users')||'[]');let list=document.getElementById('inboxList');list.innerHTML='';document.getElementById('secretBox').style.display='none';document.getElementById('backInbox').style.display='none';list.style.display='block';let others=all.filter(u=>u.username!==ME.username);if(others.length===0){list.innerHTML=`<div style="padding:30px;text-align:center;color:#888"><p>No chats yet</p><p style="margin-top:10px;font-size:13px">Create 2nd account to test inbox</p></div>`;return;}others.forEach(u=>{let key=[ME.username,u.username].sort().join('_');let last=SECRET[key]?SECRET[key][SECRET[key].length-1]:null;list.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #222" onclick="openSecret('${u.username}')"><div style="display:flex;gap:10px;align-items:center"><img src="${u.avatar}" style="width:44px;height:44px;border-radius:50%"><div><b>${u.full_name||u.username}</b><br><small style="color:#888">${last?last.text.substring(0,25):'Tap to chat'}</small></div></div><span style="color:#c084fc">💬</span></div>`;});}
function openSecret(un){CUR=un;let all=JSON.parse(localStorage.getItem('sl_all_users')||'[]');let u=all.find(x=>x.username===un)||{username:un,full_name:un};document.getElementById('inboxList').style.display='none';document.getElementById('secretBox').style.display='block';document.getElementById('backInbox').style.display='block';document.getElementById('secretName').innerText='Chat with '+(u.full_name||un);renderSecret();}
function closeSecret(){CUR=null;document.getElementById('secretBox').style.display='none';document.getElementById('inboxList').style.display='block';document.getElementById('backInbox').style.display='none';loadInboxList();}
function renderSecret(){if(!CUR)return;let key=[ME.username,CUR].sort().join('_');let msgs=SECRET[key]||[];let c=document.getElementById('secretMsgs');c.innerHTML='';msgs.forEach(m=>{let d=document.createElement('div');d.className='bubble '+(m.from===ME.username?'me':'other');d.innerHTML=`${m.text}${m.img?`<img src="${m.img}">`:''}`;c.appendChild(d);});c.scrollTop=c.scrollHeight;}
function sendSecret(){let e=document.getElementById('secretInp'),t=e.value.trim();if(!t||!CUR)return;e.value='';let key=[ME.username,CUR].sort().join('_');if(!SECRET[key])SECRET[key]=[];SECRET[key].push({from:ME.username,text:t});localStorage.setItem('sl_secret',JSON.stringify(SECRET));renderSecret();}
function sendSecretImg(ev){let file=ev.target.files[0];if(!file||!CUR)return;let fr=new FileReader();fr.onload=()=>{let key=[ME.username,CUR].sort().join('_');if(!SECRET[key])SECRET[key]=[];SECRET[key].push({from:ME.username,text:'',img:fr.result});localStorage.setItem('sl_secret',JSON.stringify(SECRET));renderSecret();};fr.readAsDataURL(file);}
function loadReels(){let c=document.getElementById('reelsList');c.innerHTML='';let reels=POSTS.filter(p=>p.type==='reel').reverse();if(reels.length===0){document.getElementById('noReels').style.display='block';return;}document.getElementById('noReels').style.display='none';reels.forEach(p=>{c.innerHTML+=`<div style="height:80vh;background:#000;position:relative;border-bottom:1px solid #222"><video src="${p.img}" controls style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;bottom:20px;left:12px"><b>@${p.username}</b><br>${p.cap||''}</div></div>`;});}
function loadStatus(){let now=Date.now();STATUS=STATUS.filter(s=>now - s.time < 86400000);localStorage.setItem('sl_status',JSON.stringify(STATUS));let bar=document.getElementById('statusBar');bar.innerHTML=`<div style="min-width:64px;text-align:center" onclick="setMode('status');nav('Create')"><div style="width:60px;height:60px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:24px">+</div><div style="font-size:11px;margin-top:4px">Add Status</div></div>`;let grouped={};STATUS.forEach(s=>{if(!grouped[s.username])grouped[s.username]=[];grouped[s.username].push(s);});Object.keys(grouped).forEach(un=>{let u=grouped[un][0];bar.innerHTML+=`<div style="min-width:64px;text-align:center" onclick="openStatus('${un}')"><div style="width:60px;height:60px;border-radius:50%;padding:3px;background:#25D366"><div style="width:100%;height:100%;border-radius:50%;background:url(${u.img}) center/cover"></div></div><div style="font-size:11px;margin-top:4px">${u.full_name||un}</div></div>`;});}
function openStatus(un){let list=STATUS.filter(s=>s.username===un);let i=0;function show(){let s=list[i];document.getElementById('statusView').style.display='flex';document.getElementById('statusOwner').innerText=s.full_name||s.username;document.getElementById('statusImg').src=s.img;document.getElementById('statusCap').innerText=s.cap||'';}show();document.getElementById('statusView').onclick=()=>{i++;if(i<list.length)show();else closeStatus();};}
function closeStatus(){document.getElementById('statusView').style.display='none';}
function doCreate(){let cap=document.getElementById('capInp').value.trim();let file=document.getElementById('fileInp').files[0];if(!file){document.getElementById('createMsg').innerText='Choose picture/video!';return;}let fr=new FileReader();fr.onload=()=>{if(MODE==='status'){STATUS.push({username:ME.username,full_name:ME.full_name,img:fr.result,cap:cap,time:Date.now()});localStorage.setItem('sl_status',JSON.stringify(STATUS));document.getElementById('createMsg').innerText='Status added!';nav('Status');return;}POSTS.push({username:ME.username,full_name:ME.full_name,img:fr.result,cap:cap,type:MODE,time:Date.now(),avatar:ME.avatar});localStorage.setItem('sl_posts',JSON.stringify(POSTS));document.getElementById('createMsg').innerText=MODE==='reel'?'Reels posted!':'Post added!';nav(MODE==='reel'?'Reels':'Feed');};fr.readAsDataURL(file);}
function loadProfile(){document.getElementById('profileBox').innerHTML=`<img src="${ME.avatar}" style="width:86px;height:86px;border-radius:50%;border:2px solid #c084fc"><h2 style="margin-top:10px">${ME.full_name||ME.username}</h2><p style="color:#888">@${ME.username}</p><p style="color:#666;font-size:13px">${ME.email} ${ME.phone||''}</p><button onclick="logout()" style="margin-top:20px;background:#222;color:#fff;border:none;padding:10px 20px;border-radius:20px">Logout</button>`;document.getElementById('myName').innerText=ME.full_name||ME.username;}
function logout(){localStorage.removeItem('sl_user');location.reload();}
function init(){loadProfile();loadFeed();loadLive();loadReels();loadStatus();}
let saved=localStorage.getItem('sl_user');if(saved){ME=JSON.parse(saved);document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();}
</script></body></html>
